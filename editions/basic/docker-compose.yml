# Docker Compose version removed as it's obsolete in newer versions

# SmokePing Basic Edition
# Simple network monitoring with LinuxServer.io SmokePing container
# Configuration via YAML files only

# Images. Every service built here also names its published image,
# ghcr.io/estcarisimo/smoking-pi/<service>:<version>, and `pull_policy:
# missing` makes Compose pull that name first and build from `build:` only
# when the pull fails. SMOKING_PI_VERSION unset means `:dev`, a tag the
# release workflow never publishes, so a clone builds what it checked out
# (the smoking-pi command, in a clone on a release tag, sets that tag's);
# the package sets SMOKING_PI_VERSION to its own version and pulls (the
# release workflow builds arm64+amd64 on every `vX.Y.Z` tag). Point
# SMOKING_PI_REGISTRY at a fork's registry to pull from there.
# (docs/packaging.md, "Published images".)

services:
  smokeping:
    build:
      # Context is `shared/` so the image can copy in the exporters
      # (shared/modules/smokeping-exporters) -- docs/packaging.md backlog #2.
      context: ../../shared
      dockerfile: modules/smokeping/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/smokeping:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-basic
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - smokeping-config:/config
      - smokeping-data:/data
      - ./config:/config/targets:ro
      - ./scripts:/scripts:ro
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${SMOKEPING_PORT:-8080}:80"
    restart: unless-stopped
    entrypoint: /docker-entrypoint.sh
    networks:
      - smokeping-net

  # The Pi's name on the LAN: answers for <MDNS_NAME>.local (default
  # smoking-pi.local) over multicast DNS, whatever the hostname is and
  # whether or not the host runs Avahi. A second Smoking Pi on the same
  # network takes smoking-pi-2.local; `smoking-pi url` prints the name held.
  # network_mode: host: multicast DNS is the LAN's, not a Docker bridge's.
  # See docs/mdns.md.
  mdns:
    build: ../../shared/modules/mdns
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/mdns:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    network_mode: host
    restart: unless-stopped
    # It needs no capability and writes only its status.
    user: nobody
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run/mdns:mode=1777]
    environment:
      # off = answer for no name. MDNS_INTERFACES narrows the interfaces
      # (default: every LAN one with IPv4; Docker and VPNs never).
      - MDNS_NAME=${MDNS_NAME:-smoking-pi}
      - MDNS_INTERFACES=${MDNS_INTERFACES:-}

networks:
  smokeping-net:
    driver: bridge

volumes:
  smokeping-config:
    name: smokeping-basic-config
  smokeping-data:
    name: smokeping-basic-data