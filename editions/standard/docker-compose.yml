# Docker Compose version removed as it's obsolete in newer versions

# SmokePing Standard Edition
# PostgreSQL + Web Admin + Config Manager + SmokePing
# Database-driven configuration with web interface

# Images. Every service built here also names its published image,
# ghcr.io/estcarisimo/smoking-pi/<service>:<version>, and `pull_policy:
# missing` makes Compose pull that name first and build from `build:` only
# when the pull fails. SMOKING_PI_VERSION unset means `:dev`, a tag the
# release workflow never publishes, so a clone builds what it checked out
# (the smoking-pi command, in a clone on a release tag, sets that tag's);
# the package sets SMOKING_PI_VERSION to its own version and pulls (the
# release workflow builds arm64+amd64 on every `vX.Y.Z` tag). Point
# SMOKING_PI_REGISTRY at a fork's registry to pull from there.
# (docs/packaging.md, "Published images".)

services:
  postgres:
    build: 
      context: ../../shared/modules/postgres
      dockerfile: Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/postgres:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-standard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smokeping_targets}
      POSTGRES_USER: ${POSTGRES_USER:-smokeping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../shared/modules/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smokeping} -d ${POSTGRES_DB:-smokeping_targets}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - smokeping-net

  config-manager:
    build: 
      context: ../../shared/modules/config-manager
      dockerfile: Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/config-manager:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-standard-config-manager
    environment:
      CONFIG_DIR: /app/config
      OUTPUT_DIR: /app/output
      DATABASE_URL: "postgresql://${POSTGRES_USER:-smokeping}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smokeping_targets}"
      TZ: ${TZ:-UTC}
      # Compose project name for container-name resolution
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-standard}
      # Optional shared API token (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist YAML configs on the host so bootstrap output survives
      # container recreation (was previously lost in the container layer).
      # SMOKING_PI_CONFIG_DIR relocates it (packaged: /etc/smoking-pi/config);
      # an empty directory is seeded from config-manager's templates/.
      - ${SMOKING_PI_CONFIG_DIR:-./config-manager/config}:/app/config
      - config-manager-output:/app/output
      - smokeping-config:/smokeping-config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - smokeping-net

  web-admin:
    build:
      # Context is `shared/` so the image can copy in shared/modules/common
      context: ../../shared
      dockerfile: modules/web-admin/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/web-admin:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-standard-web-admin
    environment:
      CONFIG_MANAGER_URL: "http://config-manager:5000"
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-admin}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD}
      # Preferred over WEB_ADMIN_PASSWORD: werkzeug pbkdf2 hash (see .env.template)
      WEB_ADMIN_PASSWORD_HASH: ${WEB_ADMIN_PASSWORD_HASH:-}
      SECRET_KEY: ${SECRET_KEY}
      TZ: ${TZ:-UTC}
      # Run background jobs (OCA refresh, cache cleanup) in one worker
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # Optional shared API token for config-manager (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
    ports:
      - "${WEB_ADMIN_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      config-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)\" = \"200\" ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - smokeping-net

  smokeping:
    build:
      # Context is `shared/` so the image can copy in the exporters
      # (shared/modules/smokeping-exporters) -- docs/packaging.md backlog #2.
      context: ../../shared
      dockerfile: modules/smokeping/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/smokeping:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-standard
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - smokeping-data:/data
      - smokeping-config:/config
      # Shared volume with config-manager (which writes /app/output): the
      # generated Targets/Probes appear under /config/generated, and the
      # 05-link-generated-config.sh cont-init script symlinks
      # /config/{Targets,Probes} to them. (Previously smokeping bind-mounted
      # a git-tracked copy of generated output, so generated config never
      # reached SmokePing.)
      - config-manager-output:/config/generated:ro
      - ./custom-cont-init.d:/custom-cont-init.d:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${SMOKEPING_PORT:-8081}:80"
    depends_on:
      config-manager:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smokeping-net

networks:
  smokeping-net:
    driver: bridge

volumes:
  postgres-data:
    name: smokeping-standard-postgres-data
  config-manager-output:
    name: smokeping-standard-config-output
  smokeping-config:
    name: smokeping-standard-config
  smokeping-data:
    name: smokeping-standard-data