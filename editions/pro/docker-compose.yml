# Docker Compose version removed as it's obsolete in newer versions

# Bounded container logs. The json-file driver defaults to unbounded, which on
# an SD-card Pi grows without limit and keeps the card busy. Every service
# references this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

services:
  smokeping:
    build:
      context: ../../shared/modules/smokeping
      dockerfile: Dockerfile
    image: pro-smokeping
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - smokeping-data:/data
      - smokeping-config:/config
      # Directory mount (not single files): config-manager writes Targets/Probes
      # atomically via temp file + os.replace, which swaps the inode. A
      # single-file bind mount would keep pointing at the old inode until the
      # container restarts. The 05-link-generated-config.sh cont-init script
      # symlinks /config/{Targets,Probes} -> /config/generated/{Targets,Probes}.
      - ./config-manager/output:/config/generated:ro
      - ../../shared/modules/smokeping-exporters:/exporters:ro
      - ./custom-cont-init.d:/custom-cont-init.d:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Time-series database configuration
      - TSDB_TYPE=${TSDB_TYPE:-influxdb}  # influxdb or clickhouse
      - INFLUX_URL=http://localhost:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - CLICKHOUSE_URL=http://localhost:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-smokeping}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-smokeping}
      - RRD_DIR=${RRD_DIR}
      - TZ=${TZ:-UTC}
      # CPE microcut detection
      - CPE_DISCOVERY_INTERVAL=${CPE_DISCOVERY_INTERVAL:-3600}
      - CPE_PROBE_RATE=${CPE_PROBE_RATE:-5}
      - CPE_PROBE_WINDOW=${CPE_PROBE_WINDOW:-10}
      # Idle between probe windows; 0 restores continuous probing.
      - CPE_PROBE_IDLE=${CPE_PROBE_IDLE:-20}
      - CPE_IPV6_TARGET=${CPE_IPV6_TARGET:-dns.google}
      - CPE_IPV4_TARGET=${CPE_IPV4_TARGET:-8.8.8.8}
      - CPE_MAX_HOPS=${CPE_MAX_HOPS:-5}
    # Optional dependency on influxdb for InfluxDB mode
    depends_on:
      influxdb:
        condition: service_started
        required: false

  influxdb:
    build: ../../shared/modules/influxdb
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "${DOCKER_INFLUXDB_INIT_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:?Error: Please run ./setup.sh first to generate passwords}"
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - influxdb

  grafana:
    build: ../../shared/modules/grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../shared/modules/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../shared/modules/grafana/provisioning/dashboards-clickhouse:/etc/grafana/provisioning/dashboards-clickhouse:ro
      - ../../shared/modules/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      # Database configuration
      TSDB_TYPE: ${TSDB_TYPE:-influxdb}  # influxdb or clickhouse
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_ORG: ${INFLUX_ORG}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-smokeping}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smokeping}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      # Grafana configuration
      # info, not debug: at debug Grafana emitted ~1,100 log lines every three
      # minutes (every internal API call, bleve reindex and provisioning walk)
      # straight to an SD card. Override per-run when actually debugging.
      GF_LOG_LEVEL: ${GF_LOG_LEVEL:-info}
      GF_PROVISIONING_LOG_LEVEL: ${GF_PROVISIONING_LOG_LEVEL:-info}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      GF_SECURITY_SECRET_KEY: "${GF_SECURITY_SECRET_KEY:?Error: Please run ./setup.sh first to generate passwords}"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_INSTALL_PLUGINS: "${GF_INSTALL_PLUGINS:-}"
      TZ: ${TZ:-UTC}
    # Optional dependency on influxdb for InfluxDB mode
    depends_on:
      influxdb:
        condition: service_started
        required: false

  web-admin:
    build: ../../shared/modules/web-admin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "0.0.0.0:8080:8080"  # Explicitly bind to all interfaces
    volumes:
      - ./config-manager/config:/app/config
      - ../../shared/modules/web-admin/app:/app/app  # Mount source code for development
      - reports:/reports:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      CONFIG_DIR: /app/config
      FLASK_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      SECRET_KEY: "${SECRET_KEY:?Error: Please run ./setup.sh first to generate passwords}"
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-admin}
      WEB_ADMIN_PASSWORD: "${WEB_ADMIN_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      # Preferred over WEB_ADMIN_PASSWORD: werkzeug pbkdf2 hash (see .env.template)
      WEB_ADMIN_PASSWORD_HASH: ${WEB_ADMIN_PASSWORD_HASH:-}
      TZ: ${TZ:-UTC}
      # Run background jobs (OCA refresh, cache cleanup) in one worker
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # Optional shared API token for config-manager (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
      # AI assistant/reports (optional; pages degrade gracefully when unset)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
      REPORTS_DIR: /reports
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-smokeping}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-smokeping}
    depends_on:
      smokeping:
        condition: service_started
      config-manager:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - default

  config-manager:
    build: ../../shared/modules/config-manager
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./config-manager/config:/app/config
      - ./config-manager/output:/app/output
      - ./smokeping/config:/app/smokeping-config
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      CONFIG_DIR: /app/config
      OUTPUT_DIR: /app/output
      TZ: ${TZ:-UTC}
      # Compose project name for container-name resolution
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-pro}
      # Optional shared API token (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
      # IPv6 gate: auto probes the host (via the SmokePing netns) and omits
      # FPing6 targets when there is no global IPv6; force keeps them
      # regardless, off never emits them. See docs/ipv6-gating.md
      IPV6_MODE: ${IPV6_MODE:-auto}
      IPV6_PROBE_HOSTS: ${IPV6_PROBE_HOSTS:-}
      IPV6_RECHECK_INTERVAL: ${IPV6_RECHECK_INTERVAL:-900}
      # PostgreSQL connection
      DATABASE_URL: "postgresql://smokeping:${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}@postgres:5432/smokeping_targets"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: 
      context: ../../shared/modules/postgres
      dockerfile: Dockerfile
    image: pro-postgres
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../shared/modules/postgres/init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      POSTGRES_DB: smokeping_targets
      POSTGRES_USER: smokeping
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smokeping -d smokeping_targets"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MCP server (AI-operable SmokePing) — opt-in via the `mcp` profile:
  #   COMPOSE_PROFILES=mcp docker compose up -d mcp-server
  # See docs/mcp-server.md
  mcp-server:
    build: ../../shared/modules/mcp-server
    container_name: smokeping-mcp-server
    restart: unless-stopped
    logging: *default-logging
    profiles: [mcp]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8090
      # Bearer token for the HTTP transport (empty = unauthenticated, as
      # before). The port is bound to 127.0.0.1, so this guards against other
      # processes on the host. See docs/openclaw-integration.md
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      - CONFIG_API_URL=${CONFIG_API_URL:-http://config-manager:5000}
      - CONFIG_API_TOKEN=${CONFIG_API_TOKEN:-}
      - INFLUX_URL=${INFLUX_URL:-http://influxdb:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      # Deep links back into Grafana / web-admin. Unset means tool responses
      # carry numbers only — this host is reachable on a LAN IP, a Tailscale
      # name and a tunnel hostname, so the right one cannot be guessed and a
      # wrong guess is worse than no link. See docs/mcp-server.md
      - PUBLIC_BASE_HOST=${PUBLIC_BASE_HOST:-}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-}
      - WEB_ADMIN_PUBLIC_URL=${WEB_ADMIN_PUBLIC_URL:-}
    depends_on:
      - config-manager

  # AI health reports (opt-in: COMPOSE_PROFILES=ai; needs ANTHROPIC_API_KEY)
  ai-insights:
    build: ../../shared/modules/ai-insights
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - ai
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-haiku-4-5-20251001}
      - REPORT_INTERVAL=${REPORT_INTERVAL:-86400}
      - AI_REPORTS_PER_DAY=${AI_REPORTS_PER_DAY:-8}
      - REPORTS_DIR=/reports
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      - TZ=${TZ:-UTC}
    volumes:
      - reports:/reports
    depends_on:
      influxdb:
        condition: service_started
        required: false

  # Alerting engine (opt-in: COMPOSE_PROFILES=alerts). Deterministic rules
  # over InfluxDB with OpenClaw-hook / generic-webhook delivery.
  # See docs/alerting.md. Uses network_mode: host (InfluxDB + the local
  # OpenClaw gateway both live on localhost), so no ports/networks keys.
  alerter:
    build: ../../shared/modules/alerter
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    profiles: [alerts]
    environment:
      # Delivery: off (log-only, default) | openclaw | webhook
      - NOTIFY_MODE=${NOTIFY_MODE:-off}
      - OPENCLAW_URL=${OPENCLAW_URL:-http://127.0.0.1:18789}
      # /tools/invoke is OpenClaw's HTTP tool endpoint, always enabled and
      # multiplexed onto the gateway port. Override only for a proxy/bridge.
      - OPENCLAW_HOOK_PATH=${OPENCLAW_HOOK_PATH:-/tools/invoke}
      # Gateway token = gateway.auth.token in ~/.openclaw/openclaw.json.
      # OPENCLAW_HOOK_TOKEN is accepted as a legacy alias.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN:-}
      - OPENCLAW_CHANNEL=${OPENCLAW_CHANNEL:-telegram}
      - OPENCLAW_TO=${OPENCLAW_TO:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN:-}
      # Cadence / dedup / report delivery (seconds)
      - ALERT_INTERVAL=${ALERT_INTERVAL:-60}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-3600}
      # How long an incident must stay ABSENT before it counts as recovered.
      # Without this, a rule that flaps alternates alert/recovery and the
      # cooldown never applies, because recovery deletes the record.
      - ALERT_RESOLVE_AFTER=${ALERT_RESOLVE_AFTER:-900}
      # Hard ceiling per incident key per rolling hour. A blast-radius limit,
      # not a tuning knob — unreachable in normal operation.
      - ALERT_MAX_PER_HOUR=${ALERT_MAX_PER_HOUR:-6}
      - REPORT_DELIVERY_INTERVAL=${REPORT_DELIVERY_INTERVAL:-86400}
      # Rule thresholds (optional overrides; module defaults apply)
      - DOWN_WINDOW=${DOWN_WINDOW:-900}
      - HIGH_LOSS_PCT=${HIGH_LOSS_PCT:-20}
      # Counts OBSERVED windows, so rescale it with CPE_PROBE_IDLE.
      - MICROCUT_BURST_N=${MICROCUT_BURST_N:-2}
      - MICROCUT_LOSS_PCT=${MICROCUT_LOSS_PCT:-50}
      - REPORT_MAX_CHARS=${REPORT_MAX_CHARS:-3500}
      # host netns: InfluxDB is published on localhost:8086
      - INFLUX_URL=${INFLUX_URL:-http://localhost:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      - TZ=${TZ:-UTC}
    volumes:
      - reports:/reports:ro
      - alerter-state:/var/lib/alerter
    depends_on:
      influxdb:
        condition: service_started
        required: false

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: smokeping-pro-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smokeping}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-smokeping}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ../../shared/modules/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - clickhouse

volumes:
  smokeping-data:
  smokeping-config:
  influxdb-data:
  grafana-data:
  postgres-data:
  reports:
  alerter-state:
  clickhouse-data:
    name: smokeping-pro-clickhouse-data
  clickhouse-logs:
    name: smokeping-pro-clickhouse-logs
