# Docker Compose version removed as it's obsolete in newer versions

# Bounded container logs. The json-file driver defaults to unbounded, which on
# an SD-card Pi grows without limit and keeps the card busy. Every service
# references this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

# Images. Every service built here also names its published image,
# ghcr.io/estcarisimo/smoking-pi/<service>:<version>, and `pull_policy:
# missing` makes Compose pull that name first and build from `build:` only
# when the pull fails. SMOKING_PI_VERSION unset means `:dev`, a tag the
# release workflow never publishes, so a clone builds what it checked out
# (the smoking-pi command, in a clone on a release tag, sets that tag's);
# the package sets SMOKING_PI_VERSION to its own version and pulls (the
# release workflow builds arm64+amd64 on every `vX.Y.Z` tag). Point
# SMOKING_PI_REGISTRY at a fork's registry to pull from there.
# (docs/packaging.md, "Published images".)

services:
  smokeping:
    build:
      # Context is `shared/` so the image can copy in the exporters
      # (shared/modules/smokeping-exporters) -- docs/packaging.md backlog #2.
      context: ../../shared
      dockerfile: modules/smokeping/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/smokeping:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    # Pinned, because Docker writes a container's /etc/resolv.conf ONCE at
    # creation and never again. Inheriting the host's resolver freezes
    # whatever it happened to be at that instant: this deployment captured a
    # Tailscale MagicDNS address (100.100.100.100), Tailscale later logged
    # out, and every hostname target read 100% loss for ten days while every
    # raw-IP target stayed green. Nothing surfaced it, because "100% loss"
    # and "that host is down" look identical.
    #
    # `dns:` is honoured even under network_mode: host. Public resolvers by
    # default so this does not depend on any particular LAN addressing;
    # override for a deployment with internal-only target names. The DNS
    # *probes* are unaffected either way -- they run `dig` against an
    # explicit server (`host = 8.8.8.8`) and never consult resolv.conf.
    dns:
      - ${SMOKEPING_DNS:-1.1.1.1}
      - ${SMOKEPING_DNS_FALLBACK:-8.8.8.8}
    volumes:
      - smokeping-data:/data
      - smokeping-config:/config
      # Directory mount (not single files): config-manager writes Targets/Probes
      # atomically via temp file + os.replace, which swaps the inode. A
      # single-file bind mount would keep pointing at the old inode until the
      # container restarts. The 05-link-generated-config.sh cont-init script
      # symlinks /config/{Targets,Probes} -> /config/generated/{Targets,Probes}.
      # SMOKING_PI_OUTPUT_DIR relocates it (packaged: /var/lib/smoking-pi/output).
      - ${SMOKING_PI_OUTPUT_DIR:-./config-manager/output}:/config/generated:ro
      # Development overlay over the copy baked into the image; dropped by
      # docker-compose.packaged.yml (docs/packaging.md, "Packaged mode").
      - ../../shared/modules/smokeping-exporters:/exporters:ro
      - ./custom-cont-init.d:/custom-cont-init.d:ro
      # The DNS observer's state (wizard.json), read-only. Empty while the
      # dns profile is off, and the exporter then writes nothing.
      - dns-observer-state:/dns-observer:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Time-series database configuration
      - TSDB_TYPE=${TSDB_TYPE:-influxdb}  # influxdb or clickhouse
      - INFLUX_URL=http://localhost:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - CLICKHOUSE_URL=http://localhost:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-smokeping}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-smokeping}
      - RRD_DIR=${RRD_DIR}
      - TZ=${TZ:-UTC}
      # CPE microcut detection
      - CPE_DISCOVERY_INTERVAL=${CPE_DISCOVERY_INTERVAL:-3600}
      - CPE_PROBE_RATE=${CPE_PROBE_RATE:-5}
      - CPE_PROBE_WINDOW=${CPE_PROBE_WINDOW:-10}
      # Idle between probe windows; 0 restores continuous probing.
      - CPE_PROBE_IDLE=${CPE_PROBE_IDLE:-20}
      - CPE_IPV6_TARGET=${CPE_IPV6_TARGET:-dns.google}
      - CPE_IPV4_TARGET=${CPE_IPV4_TARGET:-8.8.8.8}
      - CPE_MAX_HOPS=${CPE_MAX_HOPS:-5}
      # Wi-Fi link collector (docs/wifi.md). Interface auto-detected: the
      # wireless one carrying the default route. Empty = auto.
      - WIFI_INTERFACE=${WIFI_INTERFACE:-}
      - WIFI_SAMPLE_INTERVAL=${WIFI_SAMPLE_INTERVAL:-10}
      # Channel/width/survey change only on a roam; sampled less often.
      - WIFI_SLOW_INTERVAL=${WIFI_SLOW_INTERVAL:-60}
      # Which public resolver answers (docs/public-resolver.md): every
      # RESOLVER_INTERVAL seconds, through RESOLVER_VIA (auto = the default
      # gateway; off; or an address) and through the DNS observer on
      # DNS_PORT when it runs (RESOLVER_OBSERVER=off skips that path).
      - RESOLVER_INTERVAL=${RESOLVER_INTERVAL:-900}
      - RESOLVER_VIA=${RESOLVER_VIA:-auto}
      - RESOLVER_OBSERVER=${RESOLVER_OBSERVER:-auto}
      - DNS_PORT=${DNS_PORT:-53}
      # The DNS wizard's snapshot, from the observer's state volume. The
      # names of the house's services go to InfluxDB (and Grafana) only
      # with DNS_EXPORT_NAMES=1; the numbers about them always do.
      - DNS_EXPORT_NAMES=${DNS_EXPORT_NAMES:-0}
    # Optional dependency on influxdb for InfluxDB mode
    depends_on:
      influxdb:
        condition: service_started
        required: false

  influxdb:
    build: ../../shared/modules/influxdb
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/influxdb:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "${DOCKER_INFLUXDB_INIT_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:?Error: Please run ./setup.sh first to generate passwords}"
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - influxdb

  grafana:
    build: ../../shared/modules/grafana
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/grafana:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../shared/modules/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../shared/modules/grafana/provisioning/dashboards-clickhouse:/etc/grafana/provisioning/dashboards-clickhouse:ro
      - ../../shared/modules/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      # Database configuration
      TSDB_TYPE: ${TSDB_TYPE:-influxdb}  # influxdb or clickhouse
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_ORG: ${INFLUX_ORG}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-smokeping}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smokeping}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      # Grafana configuration
      # info, not debug: at debug Grafana emitted ~1,100 log lines every three
      # minutes (every internal API call, bleve reindex and provisioning walk)
      # straight to an SD card. Override per-run when actually debugging.
      GF_LOG_LEVEL: ${GF_LOG_LEVEL:-info}
      GF_PROVISIONING_LOG_LEVEL: ${GF_PROVISIONING_LOG_LEVEL:-info}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      GF_SECURITY_SECRET_KEY: "${GF_SECURITY_SECRET_KEY:?Error: Please run ./setup.sh first to generate passwords}"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      # Snapshots off. A Grafana snapshot is a PERMANENT, UNAUTHENTICATED URL
      # carrying the data embedded in it: `GET /api/snapshots/<key>` answers
      # 200 with no credentials, verified on 13.0.2. Everything else here sits
      # behind login (anonymous auth is off, the API 401s), so leaving this on
      # would be the one hole in that -- and it opens with a single click from
      # any share dialog, by someone who has no reason to expect the result to
      # be public.
      #
      # external_enabled is worse and defaults ON: it publishes to
      # snapshots.raintank.io, a third-party site, putting a home network's
      # measurements somewhere neither the operator nor this repo controls.
      #
      # Links in alerts point at Grafana itself and the reader logs in, which
      # is the intended design -- see docs/alerting.md. Deep links do not need
      # snapshots and never did.
      GF_SNAPSHOTS_ENABLED: "${GF_SNAPSHOTS_ENABLED:-false}"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "${GF_SNAPSHOTS_EXTERNAL_ENABLED:-false}"
      GF_INSTALL_PLUGINS: "${GF_INSTALL_PLUGINS:-}"
      TZ: ${TZ:-UTC}
    # Optional dependency on influxdb for InfluxDB mode
    depends_on:
      influxdb:
        condition: service_started
        required: false

  web-admin:
    build:
      # Context is `shared/`, like the alerter and the MCP server, so the
      # image can copy in shared/modules/common: the assistant's tools read
      # the microcut definition from common/microcuts.py.
      context: ../../shared
      dockerfile: modules/web-admin/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/web-admin:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "0.0.0.0:8080:8080"  # Explicitly bind to all interfaces
    volumes:
      - ${SMOKING_PI_CONFIG_DIR:-./config-manager/config}:/app/config
      # Development overlay over the code in the image; dropped by
      # docker-compose.packaged.yml.
      - ../../shared/modules/web-admin/app:/app/app
      # (/app/common is NOT mounted: a change to shared/modules/common needs
      # `docker compose build web-admin`, as for the other three images)
      - reports:/reports:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      CONFIG_DIR: /app/config
      FLASK_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      SECRET_KEY: "${SECRET_KEY:?Error: Please run ./setup.sh first to generate passwords}"
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-admin}
      WEB_ADMIN_PASSWORD: "${WEB_ADMIN_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      # Preferred over WEB_ADMIN_PASSWORD: werkzeug pbkdf2 hash (see .env.template)
      WEB_ADMIN_PASSWORD_HASH: ${WEB_ADMIN_PASSWORD_HASH:-}
      TZ: ${TZ:-UTC}
      # Run background jobs (OCA refresh, cache cleanup) in one worker
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # Optional shared API token for config-manager (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
      # AI assistant/reports (optional; pages degrade gracefully when unset)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
      REPORTS_DIR: /reports
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-smokeping}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-smokeping}
      # The assistant's get_microcut_stats reads CPE cuts against the same
      # threshold as the alerter and the MCP server.
      MICROCUT_LOSS_PCT: ${MICROCUT_LOSS_PCT:-50}
    depends_on:
      smokeping:
        condition: service_started
      config-manager:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - default

  config-manager:
    build: ../../shared/modules/config-manager
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/config-manager:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # The YAML the stack rewrites and the generated SmokePing config live
      # outside the source tree when SMOKING_PI_CONFIG_DIR / _OUTPUT_DIR are
      # set (packaged layout: /etc/smoking-pi/config, /var/lib/smoking-pi/output).
      # The defaults are untracked directories; config-manager seeds an
      # empty config dir from its templates/ on first start.
      - ${SMOKING_PI_CONFIG_DIR:-./config-manager/config}:/app/config
      - ${SMOKING_PI_OUTPUT_DIR:-./config-manager/output}:/app/output
      - ./smokeping/config:/app/smokeping-config
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      CONFIG_DIR: /app/config
      OUTPUT_DIR: /app/output
      TZ: ${TZ:-UTC}
      # Compose project name for container-name resolution
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-pro}
      # Optional shared API token (empty = auth disabled)
      CONFIG_API_TOKEN: ${CONFIG_API_TOKEN:-}
      # IPv6 gate: auto probes the host (via the SmokePing netns) and omits
      # FPing6 targets when there is no global IPv6; force keeps them
      # regardless, off never emits them. See docs/ipv6-gating.md
      IPV6_MODE: ${IPV6_MODE:-auto}
      IPV6_PROBE_HOSTS: ${IPV6_PROBE_HOSTS:-}
      IPV6_RECHECK_INTERVAL: ${IPV6_RECHECK_INTERVAL:-900}
      # PostgreSQL connection
      DATABASE_URL: "postgresql://smokeping:${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}@postgres:5432/smokeping_targets"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: 
      context: ../../shared/modules/postgres
      dockerfile: Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/postgres:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../shared/modules/postgres/init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      POSTGRES_DB: smokeping_targets
      POSTGRES_USER: smokeping
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Please run ./setup.sh first to generate passwords}"
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smokeping -d smokeping_targets"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MCP server (AI-operable SmokePing) — opt-in via the `mcp` profile:
  #   COMPOSE_PROFILES=mcp docker compose up -d mcp-server
  # See docs/mcp-server.md
  mcp-server:
    build:
      # Context is `shared/`, not the module dir, so the image can also
      # copy in shared/modules/common (Flux helpers, aggregates, deep-link
      # UID maps). Containers cannot import across each other.
      context: ../../shared
      dockerfile: modules/mcp-server/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/mcp-server:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    container_name: smokeping-mcp-server
    restart: unless-stopped
    logging: *default-logging
    profiles: [mcp]
    # Host networking, like the alerter, and for the same reason: the OpenClaw
    # gateway listens on the host's loopback only (gateway.bind=loopback --
    # correct, keep it), which no bridge network can reach. get_chart's
    # deliver=true needs it. Loopback exposure is unchanged: MCP_HOST binds
    # the listener to 127.0.0.1 exactly as the old "127.0.0.1:8090:8090"
    # port mapping did, so nothing on the LAN can see the server. The one
    # reason to override it is a tailnet address for an OpenClaw on another
    # machine (docs/remote-openclaw.md, option B2); never 0.0.0.0.
    network_mode: host
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=${MCP_HOST:-127.0.0.1}
      - MCP_PORT=8090
      # Bearer token for the HTTP transport (empty = unauthenticated, as
      # before). The port is bound to 127.0.0.1, so this guards against other
      # processes on the host. See docs/openclaw-integration.md
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      # Loopback addresses: under host networking the Compose service names
      # do not resolve, and both services publish on 127.0.0.1 anyway.
      - CONFIG_API_URL=${MCP_CONFIG_API_URL:-http://127.0.0.1:5000}
      - CONFIG_API_TOKEN=${CONFIG_API_TOKEN:-}
      - INFLUX_URL=${MCP_INFLUX_URL:-http://127.0.0.1:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      # Deep links back into Grafana / web-admin. Unset means tool responses
      # carry numbers only — this host is reachable on a LAN IP, a Tailscale
      # name and a tunnel hostname, so the right one cannot be guessed and a
      # wrong guess is worse than no link. See docs/mcp-server.md
      - PUBLIC_BASE_HOST=${PUBLIC_BASE_HOST:-}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-}
      - WEB_ADMIN_PUBLIC_URL=${WEB_ADMIN_PUBLIC_URL:-}
      # The from-anywhere twin of the three above. Set both tiers and each
      # link is emitted twice, so an answer read on cellular still opens.
      - TUNNEL_BASE_HOST=${TUNNEL_BASE_HOST:-}
      - GRAFANA_TUNNEL_URL=${GRAFANA_TUNNEL_URL:-}
      - WEB_ADMIN_TUNNEL_URL=${WEB_ADMIN_TUNNEL_URL:-}
      # Mute control. This container is the ONLY writer of the mutes file and
      # reads the alerter's state file read-only -- the mirror image of the
      # alerter's mounts. Single-writer per file is what removes the race.
      - ALERT_MUTES_FILE=${ALERT_MUTES_FILE:-/var/lib/alerter-mutes/mutes.json}
      - ALERT_STATE_FILE=${ALERT_STATE_FILE:-/var/lib/alerter/state.json}
      # get_chart(deliver=true) posts the PNG into the chat through the same
      # Gateway endpoint the alerter uses, with the same token/recipient.
      - OPENCLAW_URL=${OPENCLAW_URL:-http://127.0.0.1:18789}
      - OPENCLAW_HOOK_PATH=${OPENCLAW_HOOK_PATH:-/tools/invoke}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN:-}
      - OPENCLAW_CHANNEL=${OPENCLAW_CHANNEL:-telegram}
      - OPENCLAW_TO=${OPENCLAW_TO:-}
      - ALERT_IMAGE_AS_DOCUMENT=${ALERT_IMAGE_AS_DOCUMENT:-true}
      # Chart rendering knobs, shared with the alerter (see .env.template).
      # TZ matters: the chart's time axis and footer are drawn in local time,
      # and a chart in UTC under an alert in local time is an hour of
      # confusion that says nothing about itself.
      - CHART_THEME=${CHART_THEME:-dark}
      - CHART_MAX_BYTES=${CHART_MAX_BYTES:-700000}
      # The loss panel draws the alert threshold that applies, so the chart
      # says the same thing the alerter would. Same defaults as the alerter.
      - HIGH_LOSS_PCT=${HIGH_LOSS_PCT:-20}
      - MICROCUT_LOSS_PCT=${MICROCUT_LOSS_PCT:-50}
      # get_wifi_stats calls the uplink weak below this; same as the alerter.
      - WIFI_WEAK_DBM=${WIFI_WEAK_DBM:--75}
      - TZ=${TZ:-UTC}
    volumes:
      - alerter-mutes:/var/lib/alerter-mutes
      - alerter-state:/var/lib/alerter:ro
    depends_on:
      - config-manager

  # AI health reports (opt-in: COMPOSE_PROFILES=ai; needs ANTHROPIC_API_KEY)
  ai-insights:
    build:
      # Context is `shared/`, not the module dir, so the image can also
      # copy in shared/modules/common (Flux helpers, aggregates, deep-link
      # UID maps). Containers cannot import across each other.
      context: ../../shared
      dockerfile: modules/ai-insights/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/ai-insights:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - ai
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-haiku-4-5-20251001}
      - REPORT_INTERVAL=${REPORT_INTERVAL:-86400}
      - AI_REPORTS_PER_DAY=${AI_REPORTS_PER_DAY:-8}
      - REPORTS_DIR=/reports
      # The report reads CPE cuts against the same threshold as the alerter.
      - MICROCUT_LOSS_PCT=${MICROCUT_LOSS_PCT:-50}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      - TZ=${TZ:-UTC}
    volumes:
      - reports:/reports
    depends_on:
      influxdb:
        condition: service_started
        required: false

  # Alerting engine (opt-in: COMPOSE_PROFILES=alerts). Deterministic rules
  # over InfluxDB with OpenClaw-hook / generic-webhook delivery.
  # See docs/alerting.md. Uses network_mode: host (InfluxDB + the local
  # OpenClaw gateway both live on localhost), so no ports/networks keys.
  alerter:
    build:
      # Context is `shared/`, not the module dir, so the image can also
      # copy in shared/modules/common (Flux helpers, aggregates, deep-link
      # UID maps). Containers cannot import across each other.
      context: ../../shared
      dockerfile: modules/alerter/Dockerfile
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/alerter:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    profiles: [alerts]
    environment:
      # Delivery: off (log-only, default) | openclaw | webhook
      - NOTIFY_MODE=${NOTIFY_MODE:-off}
      - OPENCLAW_URL=${OPENCLAW_URL:-http://127.0.0.1:18789}
      # /tools/invoke is OpenClaw's HTTP tool endpoint, always enabled and
      # multiplexed onto the gateway port. Override only for a proxy/bridge.
      - OPENCLAW_HOOK_PATH=${OPENCLAW_HOOK_PATH:-/tools/invoke}
      # Gateway token = gateway.auth.token in ~/.openclaw/openclaw.json.
      # OPENCLAW_HOOK_TOKEN is accepted as a legacy alias.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Daily digest (opt-in). A wall-clock summary so that silence on a
      # good day is distinguishable from a monitor that stopped. See
      # docs/alerting.md
      - DIGEST_ENABLED=${DIGEST_ENABLED:-false}
      - DIGEST_AT=${DIGEST_AT:-08:30}
      - DIGEST_TZ=${DIGEST_TZ:-}
      - DIGEST_WINDOW_HOURS=${DIGEST_WINDOW_HOURS:-24}
      - DIGEST_MAX_LATENESS=${DIGEST_MAX_LATENESS:-14400}
      - DIGEST_SILENT=${DIGEST_SILENT:-true}
      - DIGEST_HISTORY_MAX=${DIGEST_HISTORY_MAX:-200}
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN:-}
      - OPENCLAW_CHANNEL=${OPENCLAW_CHANNEL:-telegram}
      - OPENCLAW_TO=${OPENCLAW_TO:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN:-}
      # Cadence / dedup / report delivery (seconds)
      - ALERT_INTERVAL=${ALERT_INTERVAL:-60}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-3600}
      # How long an incident must stay ABSENT before it counts as recovered.
      # Without this, a rule that flaps alternates alert/recovery and the
      # cooldown never applies, because recovery deletes the record.
      - ALERT_RESOLVE_AFTER=${ALERT_RESOLVE_AFTER:-900}
      # Hard ceiling per incident key per rolling hour. A blast-radius limit,
      # not a tuning knob — unreachable in normal operation.
      - ALERT_MAX_PER_HOUR=${ALERT_MAX_PER_HOUR:-6}
      - REPORT_DELIVERY_INTERVAL=${REPORT_DELIVERY_INTERVAL:-86400}
      # Rule thresholds (optional overrides; module defaults apply).
      # These defaults MUST track the DEFAULT_* constants in evaluator.py --
      # a value here silently overrides the module default, which is how the
      # 900 s DOWN_WINDOW survived the flap fix that raised it to 1200.
      # doctor's check_alerter_env_defaults_match now enforces the pairing.
      - DOWN_WINDOW=${DOWN_WINDOW:-1200}
      - STALE_WINDOW=${STALE_WINDOW:-1200}
      - HIGH_LOSS_PCT=${HIGH_LOSS_PCT:-20}
      # high_loss must PERSIST: this many probe cycles above 15% loss in the
      # window, not one bad cycle averaged over the threshold.
      - HIGH_LOSS_MIN_POINTS=${HIGH_LOSS_MIN_POINTS:-2}
      # Widespread loss (one incident instead of one per target): the share
      # of reporting targets that must lose WIDESPREAD_LOSS_PCT in the same
      # probe cycle. All of them at 100% for three cycles is uplink_down.
      - WIDESPREAD_PCT=${WIDESPREAD_PCT:-80}
      - WIDESPREAD_LOSS_PCT=${WIDESPREAD_LOSS_PCT:-30}
      # microcut_burst fires on any confirmed cut (two consecutive windows
      # above MICROCUT_LOSS_PCT, or one at 100%), or on this many isolated
      # single windows in the hour (possible cuts). Windows are ~30 s apart;
      # rescale the notion of "consecutive" (common/microcuts.py GAP_S) if
      # CPE_PROBE_IDLE changes.
      - MICROCUT_BURST_N=${MICROCUT_BURST_N:-3}
      - MICROCUT_LOSS_PCT=${MICROCUT_LOSS_PCT:-50}
      - REPORT_MAX_CHARS=${REPORT_MAX_CHARS:-3500}
      # Message rendering: html (Telegram's default parse mode) | plain
      - ALERT_MARKUP=${ALERT_MARKUP:-html}
      # Charts attached to alerts. Rendered in-process and posted as base64,
      # so nothing is written to disk and no renderer service is needed.
      - ALERT_CHARTS=${ALERT_CHARTS:-true}
      - CHART_HOURS=${CHART_HOURS:-6}
      - CHART_THEME=${CHART_THEME:-dark}
      - CHART_MAX_BYTES=${CHART_MAX_BYTES:-700000}
      # Telegram re-encodes photos as JPEG, which wrecks thin chart lines.
      - ALERT_IMAGE_AS_DOCUMENT=${ALERT_IMAGE_AS_DOCUMENT:-true}
      - ALERT_SILENT=${ALERT_SILENT:-false}
      # "Is it me or the internet?" thresholds. Derived from rows the rules
      # already fetch, so tuning these costs no extra queries.
      - VERDICT_BROAD_PCT=${VERDICT_BROAD_PCT:-60}
      - VERDICT_MIN_TARGETS=${VERDICT_MIN_TARGETS:-3}
      - VERDICT_IMPAIRED_LOSS_PCT=${VERDICT_IMPAIRED_LOSS_PCT:-10}
      # A target stuck at 100% longer than this never answered ICMP in the
      # first place; counting it would turn one slow site into an outage.
      - VERDICT_STALE_DOWN_HOURS=${VERDICT_STALE_DOWN_HOURS:-6}
      # The Wi-Fi uplink (wifi_link, when the host has one): a signal below
      # WIFI_WEAK_DBM for at least WIFI_WEAK_SAMPLES samples in the hour --
      # one minute's worth at WIFI_SAMPLE_INTERVAL=10, rescale together --
      # makes a cutting first hop "your Wi-Fi" rather than "your line".
      - WIFI_WEAK_DBM=${WIFI_WEAK_DBM:--75}
      - WIFI_WEAK_SAMPLES=${WIFI_WEAK_SAMPLES:-6}
      # Deep links embedded in alerts. Unset = alerts carry no links, which
      # is deliberate: see docs/mcp-server.md.
      - TSDB_TYPE=${TSDB_TYPE:-influxdb}
      - PUBLIC_BASE_HOST=${PUBLIC_BASE_HOST:-}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-}
      - WEB_ADMIN_PUBLIC_URL=${WEB_ADMIN_PUBLIC_URL:-}
      # The from-anywhere twin of the three above. Set both tiers and each
      # link is emitted twice, so an answer read on cellular still opens.
      - TUNNEL_BASE_HOST=${TUNNEL_BASE_HOST:-}
      - GRAFANA_TUNNEL_URL=${GRAFANA_TUNNEL_URL:-}
      - WEB_ADMIN_TUNNEL_URL=${WEB_ADMIN_TUNNEL_URL:-}
      # host netns: InfluxDB is published on localhost:8086
      - INFLUX_URL=${INFLUX_URL:-http://localhost:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-smokeping}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-smokeping}
      - TZ=${TZ:-UTC}
      # Mutes are WRITTEN by mcp-server and only READ here. The :ro mount
      # below makes that an OS-enforced invariant rather than a convention:
      # neither container ever read-modify-writes a file the other writes, so
      # there is no race to lock against. An unreadable mutes file means
      # everything alerts -- see shared/modules/common/mutes.py
      - ALERT_MUTES_FILE=${ALERT_MUTES_FILE:-/var/lib/alerter-mutes/mutes.json}
    volumes:
      - reports:/reports:ro
      - alerter-state:/var/lib/alerter
      - alerter-mutes:/var/lib/alerter-mutes:ro
    depends_on:
      influxdb:
        condition: service_started
        required: false

  # DNS observer (opt-in: COMPOSE_PROFILES=dns, or `smoking-pi dns enable`).
  # AdGuard Home with filtering off, as the resolver the router forwards the
  # house's DNS to, plus a supervisor that restarts it when it stops
  # answering and says when observations stop arriving (router reverted,
  # never configured, container down). See docs/dns-observer.md.
  # network_mode: host: it binds port 53 on the Pi and must see the real
  # client address; its admin API stays on 127.0.0.1.
  dns-observer:
    build: ../../shared/modules/dns-observer
    image: ${SMOKING_PI_REGISTRY:-ghcr.io/estcarisimo/smoking-pi}/dns-observer:${SMOKING_PI_VERSION:-dev}
    pull_policy: missing
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    profiles: [dns]
    environment:
      # Port 53 on every IPv4 address by default; a comma-separated list
      # of addresses narrows it (the LAN address only, say).
      - DNS_BIND=${DNS_BIND:-0.0.0.0}
      - DNS_PORT=${DNS_PORT:-53}
      # Encrypted upstreams first, then plain DNS as the last resort. Never
      # the router: it forwards to the Pi, so that is a loop (refused).
      - DNS_UPSTREAMS=${DNS_UPSTREAMS:-https://1.1.1.1/dns-query,https://8.8.8.8/dns-query}
      - DNS_FALLBACK=${DNS_FALLBACK:-1.1.1.1,8.8.8.8}
      - DNS_BOOTSTRAP=${DNS_BOOTSTRAP:-1.1.1.1,8.8.8.8}
      - DNS_UPSTREAM_TIMEOUT_MS=${DNS_UPSTREAM_TIMEOUT_MS:-2000}
      - DNS_ALLOW_PRIVATE_UPSTREAM=${DNS_ALLOW_PRIVATE_UPSTREAM:-}
      - DNS_ALLOW_CLIENTS=${DNS_ALLOW_CLIENTS:-}
      # Names stay on the Pi, for this long; client addresses are masked.
      - DNS_RETENTION_DAYS=${DNS_RETENTION_DAYS:-7}
      - DNS_ANONYMIZE_CLIENTS=${DNS_ANONYMIZE_CLIENTS:-1}
      # The canary: a unique name asked of the router every interval. Seen
      # here = the router forwards to the Pi. auto = the default gateway.
      - DNS_CANARY_VIA=${DNS_CANARY_VIA:-auto}
      - DNS_CANARY_DOMAIN=${DNS_CANARY_DOMAIN:-canary.smoking-pi.home.arpa}
      - DNS_CANARY_INTERVAL=${DNS_CANARY_INTERVAL:-300}
      - DNS_CANARY_MISSES=${DNS_CANARY_MISSES:-3}
      - DNS_QUIET_AFTER=${DNS_QUIET_AFTER:-1800}
      # The DNS wizard: every DNS_WIZARD_INTERVAL seconds (0 = off), what
      # the house resolved, per service, into wizard.json on the state
      # volume. DNS_WIZARD_EXCLUDE adds names to leave out, like the Pi's own.
      - DNS_WIZARD_INTERVAL=${DNS_WIZARD_INTERVAL:-600}
      - DNS_WIZARD_TOP=${DNS_WIZARD_TOP:-25}
      - DNS_WIZARD_EXCLUDE=${DNS_WIZARD_EXCLUDE:-}
      # AdGuard Home's admin UI/API: loopback only (ssh -L 3053:localhost:3053).
      - DNS_ADMIN_ADDRESS=${DNS_ADMIN_ADDRESS:-127.0.0.1:3053}
      - DNS_ADMIN_PASSWORD=${DNS_ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC}
    volumes:
      - dns-observer-conf:/opt/adguardhome/conf
      - dns-observer-work:/opt/adguardhome/work
      - dns-observer-state:/var/lib/dns-observer
      - /etc/localtime:/etc/localtime:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: smokeping-pro-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smokeping}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-smokeping}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ../../shared/modules/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - clickhouse

volumes:
  smokeping-data:
  smokeping-config:
  influxdb-data:
  grafana-data:
  postgres-data:
  reports:
  alerter-state:
  alerter-mutes:
  dns-observer-conf:
  dns-observer-work:
  dns-observer-state:
  clickhouse-data:
    name: smokeping-pro-clickhouse-data
  clickhouse-logs:
    name: smokeping-pro-clickhouse-logs
