<text x="170" y="384" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">REST</text>
<rect x="152" y="563" width="37" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="170" y="579" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">SQL</text>
<rect x="318" y="419" width="135" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="385" y="435" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">Targets, Probes</text>
<rect x="543" y="163" width="233" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="659" y="179" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">ICMP, TCP, HTTP, DNS probes</text>
