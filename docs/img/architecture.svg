<text x="414" y="944" font-size="14" fill="#1f2937">outside the containers</text>
<text x="950" y="990" text-anchor="middle" font-size="16" fill="#475569">Basic: SmokePing only.  Standard: + web-admin, config-manager, PostgreSQL.  Pro: all of it.</text>
