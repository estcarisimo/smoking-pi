<text x="1259" y="199" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">Flux</text>
<rect x="1238" y="376" width="53" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1265" y="392" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">reads</text>
<rect x="1238" y="466" width="53" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1265" y="482" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">reads</text>
<rect x="1263" y="593" width="53" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1290" y="609" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">reads</text>
<rect x="1538" y="339" width="53" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1565" y="355" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">sends</text>
<rect x="1543" y="514" width="45" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1565" y="530" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">asks</text>
<rect x="1547" y="694" width="37" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1565" y="710" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">MCP</text>
<rect x="1380" y="443" width="69" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="1415" y="459" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">reports</text>
<rect x="250" y="759" width="135" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="318" y="775" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">the house&#x27;s DNS</text>
<rect x="865" y="893" width="86" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="908" y="909" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">upstreams</text>
