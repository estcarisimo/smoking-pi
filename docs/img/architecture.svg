<text x="680" y="614" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">wizard.json</text>
<rect x="308" y="653" width="184" height="22" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="400" y="669" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">wizard.json / Targets</text>
<rect x="380" y="865" width="26" height="16" rx="3" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
<text x="414" y="878" font-size="14" fill="#1f2937">always on</text>
