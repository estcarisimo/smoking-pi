<rect x="40" y="40" width="260" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="170" y="70" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">You</text>
<text x="170" y="96" text-anchor="middle" font-size="16" fill="#1f2937">browser, on the LAN</text>
<text x="170" y="118" text-anchor="middle" font-size="16" fill="#1f2937">or a Cloudflare tunnel</text>
<rect x="470" y="40" width="360" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="650" y="70" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">What is measured</text>
<text x="650" y="96" text-anchor="middle" font-size="16" fill="#1f2937">sites, CDNs, Netflix OCAs,</text>
<text x="650" y="118" text-anchor="middle" font-size="16" fill="#1f2937">public resolvers, the router</text>
<rect x="40" y="860" width="260" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="170" y="890" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">Home router</text>
<text x="170" y="916" text-anchor="middle" font-size="16" fill="#1f2937">forwards the house&#x27;s DNS</text>
<text x="170" y="938" text-anchor="middle" font-size="16" fill="#1f2937">to the Pi (optional)</text>
<rect x="1000" y="860" width="330" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1165" y="890" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">Encrypted DNS upstreams</text>
<text x="1165" y="916" text-anchor="middle" font-size="16" fill="#1f2937">DoH to 1.1.1.1 / 8.8.8.8</text>
<text x="1165" y="938" text-anchor="middle" font-size="16" fill="#1f2937">plain DNS as last resort</text>
<rect x="1600" y="320" width="280" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1740" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">Chat and webhooks</text>
<text x="1740" y="376" text-anchor="middle" font-size="16" fill="#1f2937">Telegram via OpenClaw,</text>
<text x="1740" y="398" text-anchor="middle" font-size="16" fill="#1f2937">Slack, webhooks</text>
<rect x="1600" y="500" width="280" height="80" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1740" y="530" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">Anthropic API</text>
<text x="1740" y="556" text-anchor="middle" font-size="16" fill="#1f2937">written health reports</text>
<rect x="1600" y="670" width="280" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1740" y="700" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">AI assistants</text>
<text x="1740" y="726" text-anchor="middle" font-size="16" fill="#1f2937">OpenClaw, any MCP client;</text>
<text x="1740" y="748" text-anchor="middle" font-size="16" fill="#1f2937">charts go back to chat</text>
<rect x="40" y="220" width="260" height="120" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2.5"/>
<text x="170" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a5f">web-admin</text>
<text x="170" y="276" text-anchor="middle" font-size="16" fill="#1f2937">Flask UI :8080</text>
<text x="170" y="298" text-anchor="middle" font-size="16" fill="#1f2937">targets, probes, tour,</text>
<text x="170" y="320" text-anchor="middle" font-size="16" fill="#1f2937">AI reports</text>
<rect x="40" y="420" width="260" height="110" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2.5"/>
<text x="170" y="450" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a5f">config-manager</text>
<text x="170" y="476" text-anchor="middle" font-size="16" fill="#1f2937">REST API :5000</text>
<text x="170" y="498" text-anchor="middle" font-size="16" fill="#1f2937">writes SmokePing&#x27;s config</text>
<rect x="40" y="620" width="260" height="100" rx="12" fill="#dcfce7" stroke="#14532d" stroke-width="2.5"/>
<text x="170" y="650" text-anchor="middle" font-size="20" font-weight="bold" fill="#14532d">PostgreSQL</text>
<text x="170" y="676" text-anchor="middle" font-size="16" fill="#1f2937">targets, categories,</text>
<text x="170" y="698" text-anchor="middle" font-size="16" fill="#1f2937">probes, sources</text>
<rect x="470" y="220" width="420" height="300" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2.5"/>
<text x="680" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a5f">SmokePing</text>
<text x="680" y="276" text-anchor="middle" font-size="16" fill="#1f2937">FPing, FPing6, TCPPing, Curl (HTTP/1.1, /2, /3), DNS</text>
<text x="680" y="298" text-anchor="middle" font-size="16" fill="#1f2937">RRD files, one per target</text>
<text x="680" y="320" text-anchor="middle" font-size="16" fill="#1f2937"></text>
<text x="680" y="342" text-anchor="middle" font-size="16" fill="#1f2937">exporters started in the container:</text>
<text x="680" y="364" text-anchor="middle" font-size="16" fill="#1f2937">rrd2influx / rrd2clickhouse: RRD to the TSDB</text>
<text x="680" y="386" text-anchor="middle" font-size="16" fill="#1f2937">microcut_detector: sub-step outages</text>
<text x="680" y="408" text-anchor="middle" font-size="16" fill="#1f2937">cpe_discovery: the ISP&#x27;s first hop</text>
<text x="680" y="430" text-anchor="middle" font-size="16" fill="#1f2937">wifi_link: Wi-Fi link and uplink</text>
<text x="680" y="452" text-anchor="middle" font-size="16" fill="#1f2937">resolver_identity: which resolver answers</text>
<text x="680" y="474" text-anchor="middle" font-size="16" fill="#1f2937">dns_wizard: the wizard&#x27;s snapshot</text>
<rect x="470" y="700" width="420" height="100" rx="12" fill="#ffedd5" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="680" y="730" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">DNS observer  [dns]</text>
<text x="680" y="756" text-anchor="middle" font-size="16" fill="#1f2937">AdGuard Home :53 + the wizard</text>
<text x="680" y="778" text-anchor="middle" font-size="16" fill="#1f2937">what the house resolves</text>
<rect x="1000" y="250" width="230" height="390" rx="12" fill="#dcfce7" stroke="#14532d" stroke-width="2.5"/>
<text x="1115" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#14532d">InfluxDB  [influxdb]</text>
<text x="1115" y="306" text-anchor="middle" font-size="16" fill="#1f2937">time series</text>
<text x="1115" y="328" text-anchor="middle" font-size="16" fill="#1f2937">default backend</text>
<rect x="990" y="700" width="250" height="90" rx="12" fill="#ffedd5" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="1115" y="730" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">ClickHouse  [clickhouse]</text>
<text x="1115" y="756" text-anchor="middle" font-size="16" fill="#1f2937">alternative backend</text>
<rect x="1180" y="40" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2.5"/>
<text x="1320" y="70" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a5f">Grafana</text>
<text x="1320" y="96" text-anchor="middle" font-size="16" fill="#1f2937">dashboards :3000</text>
<text x="1320" y="118" text-anchor="middle" font-size="16" fill="#1f2937">(a ClickHouse set too)</text>
<rect x="1300" y="300" width="230" height="120" rx="12" fill="#ffedd5" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="1415" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">alerter  [alerts]</text>
<text x="1415" y="356" text-anchor="middle" font-size="16" fill="#1f2937">outages, microcuts,</text>
<text x="1415" y="378" text-anchor="middle" font-size="16" fill="#1f2937">verdicts, digests,</text>
<text x="1415" y="400" text-anchor="middle" font-size="16" fill="#1f2937">AI reports</text>
<rect x="1300" y="490" width="230" height="100" rx="12" fill="#ffedd5" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="1415" y="520" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">ai-insights  [ai]</text>
<text x="1415" y="546" text-anchor="middle" font-size="16" fill="#1f2937">health reports into</text>
<text x="1415" y="568" text-anchor="middle" font-size="16" fill="#1f2937">a shared volume</text>
<rect x="1300" y="660" width="230" height="120" rx="12" fill="#ffedd5" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="1415" y="690" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">mcp-server  [mcp]</text>
<text x="1415" y="716" text-anchor="middle" font-size="16" fill="#1f2937">tools for assistants;</text>
<text x="1415" y="738" text-anchor="middle" font-size="16" fill="#1f2937">asks config-manager,</text>
<text x="1415" y="760" text-anchor="middle" font-size="16" fill="#1f2937">mutes alerts</text>
<rect x="1600" y="860" width="280" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1740" y="890" text-anchor="middle" font-size="20" font-weight="bold" fill="#475569">On the host</text>
<text x="1740" y="916" text-anchor="middle" font-size="16" fill="#1f2937">smoking-pi CLI, systemd unit,</text>
<text x="1740" y="938" text-anchor="middle" font-size="16" fill="#1f2937">Docker Compose: runs all of it</text>
