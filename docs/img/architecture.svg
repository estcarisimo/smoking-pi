<text x="414" y="900" font-size="14" fill="#1f2937">data (InfluxDB is the influxdb profile)</text>
<rect x="380" y="909" width="26" height="16" rx="3" fill="#ffedd5" stroke="#7c2d12" stroke-width="2" stroke-dasharray="5 3"/>
