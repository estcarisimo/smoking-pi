name: Release

# Builds every image the editions declare, for linux/arm64 and linux/amd64,
# and publishes them to ghcr.io/estcarisimo/smoking-pi/<service>:<version>
# on a `vX.Y.Z` tag. This is the only place images are built by GitHub: PR
# CI keeps the cheap checks (lint, tests, compose guards) and every change is
# built and deployed on the reference Pi before merge (AGENTS.md, Process).
#
# Each architecture builds natively on its own runner -- ubuntu-24.04-arm is
# GitHub-hosted and free for public repositories -- because emulating the
# matplotlib/numpy wheels under QEMU takes the better part of an hour. The
# two builds push by digest (no tag), and a merge job stitches the two
# digests into one multi-arch manifest per service, which is what carries
# the tags. docs/packaging.md, "Published images".
#
# After the images, `package` builds the .deb from the tagged tree and
# keeps it as a workflow artifact; `host` and `debian` install it with
# each supported host's own apt (the comment above them says what each
# tier proves); and on a release tag, once every host passed, `attach`
# uploads it to the GitHub release the maintainer created for that tag
# (`gh release create`, AGENTS.md). The workflow never creates a release
# itself: publishing stays a human act.
#
# A `test-*` git tag (e.g. test-1a2b3c4, on any branch) exercises the same
# pipeline against a throwaway image tag of that name -- no `latest`, no
# version check, no release asset -- before a real release; delete the tag
# and the package versions afterwards. (workflow_dispatch would only work
# once the file is on the default branch, so it is not offered.)

on:
  push:
    tags: ['v*', 'test-*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve the image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from the git tag (vX.Y.Z is a release, test-* a throwaway)
        id: resolve
        run: |
          set -e
          case "$GITHUB_REF_NAME" in
            test-*)
              case "$GITHUB_REF_NAME" in
                *[!A-Za-z0-9._-]*) echo "refusing '$GITHUB_REF_NAME': not a valid image tag"; exit 1 ;;
              esac
              echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              echo "tags=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          # The package and `smoking-pi version` report CITATION.cff; the
          # images must carry the same number or `SMOKING_PI_VERSION` set
          # from the package would pull nothing.
          cff=$(sed -nE 's/^version: *"?([0-9.]+)"?.*/\1/p' CITATION.cff)
          [ "$cff" = "$version" ] || { echo "tag v$version but CITATION.cff says $cff"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$version latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every shared/modules/*/Dockerfile. packaging/check-images.py (CI)
        # fails when this list, the Dockerfiles and the compose files disagree.
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build context for the service
        id: ctx
        run: |
          # Images that copy shared/modules/common or the exporters build
          # from `shared/`; the rest from their own module directory. The
          # compose files declare the same contexts.
          case '${{ matrix.service }}' in
            ai-insights|alerter|mcp-server|web-admin|smokeping)
              echo "context=shared" >> "$GITHUB_OUTPUT"
              echo "dockerfile=shared/modules/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "context=shared/modules/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
              echo "dockerfile=shared/modules/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The file is named by the bare hash: upload-artifact rejects a
          # colon in a path, and the merge job prepends `sha256:` again.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.service }} (multi-arch)
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and tag it
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          set -e
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two digests (amd64, arm64), found: $(ls)"; exit 1; }
          tag_args=""
          for t in $TAGS; do tag_args="$tag_args -t $IMAGE:$t"; done
          refs=""
          for f in *; do refs="$refs $IMAGE@sha256:$f"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args $refs
      - name: Both platforms are in the published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
        run: |
          set -e
          out=$(docker buildx imagetools inspect "$IMAGE")
          echo "$out"
          echo "$out" | grep -q 'linux/amd64' || { echo "amd64 missing"; exit 1; }
          echo "$out" | grep -q 'linux/arm64' || { echo "arm64 missing"; exit 1; }

  package:
    name: Build the .deb from the tagged tree
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      deb_version: ${{ steps.build.outputs.deb_version }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the package
        id: build
        run: |
          set -e
          # A Debian version must start with a digit; a throwaway tag gets
          # a 0.0.0~ prefix so the builder and dpkg accept it.
          case "$VERSION" in
            [0-9]*) deb_version="$VERSION" ;;
            *) deb_version="0.0.0~$VERSION" ;;
          esac
          echo "deb_version=$deb_version" >> "$GITHUB_OUTPUT"
          packaging/deb/build.sh "$deb_version"
          ls -l dist/
          dpkg-deb --info dist/smoking-pi_"$deb_version"_all.deb
      - uses: actions/upload-artifact@v7
        with:
          name: smoking-pi-deb
          path: dist/*.deb
          if-no-files-found: error

  # The supported hosts (docs/packaging.md, "Supported hosts"), each
  # installing the .deb with ITS OWN apt so its own resolver picks the
  # Docker engine, CLI and Compose from the repositories that host has.
  # Two tiers, because GitHub only hosts Ubuntu VMs:
  #
  #  - `host`: Ubuntu 22.04 and 24.04, amd64 and arm64, real VMs with
  #    systemd and a daemon. The check installs the package, then the Basic
  #    edition with the images this run published, waits for its web UI,
  #    enables and starts the unit, stops it, removes the package. The
  #    runner comes with Docker's own engine; the `distro` entries purge it
  #    and drop its repository first, so apt installs Ubuntu's docker.io and
  #    docker-compose-v2 -- the stock path -- and one entry keeps Docker's.
  #  - `debian`: Debian 12 and 13 containers, what Raspberry Pi OS is built
  #    on, on both architectures. No daemon, so no stack: dependency
  #    resolution, the command, the unit, the doctor, and every edition
  #    rendered with THAT Debian's Compose. Debian 12 ships no Compose v2,
  #    so its entry adds Docker's repository first -- the documented
  #    Raspberry Pi OS path; Debian 13 resolves from its own archive.
  #
  # A container is not a Raspberry Pi: the kernel, the Wi-Fi driver, the
  # first hop and boot ordering are only proven by the release acceptance
  # on the reference Pi (docs/packaging.md). What passes here is the
  # package on that OS version, no more.
  host:
    name: Install and start on ${{ matrix.os }} ${{ matrix.arch }} (${{ matrix.engine }} engine)
    needs: [version, merge, package]
    runs-on: ${{ matrix.arch == 'arm64' && format('{0}-arm', matrix.os) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        arch: [amd64, arm64]
        engine: [distro]
        include:
          - os: ubuntu-24.04
            arch: arm64
            engine: docker.com
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - name: Replace the runner's Docker with nothing, so apt installs the distribution's
        if: matrix.engine == 'distro'
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources
          pkgs=$(dpkg-query -W -f '${Package}\n' 'docker*' 'containerd*' 'moby-*' 2>/dev/null || true)
          # shellcheck disable=SC2086
          [ -z "$pkgs" ] || sudo apt-get purge -y -qq $pkgs >/dev/null
          ! command -v docker || { echo "docker still present: $(command -v docker)"; exit 1; }
      - name: Install the package, start Basic with this run's images, stop, remove
        run: |
          set -e
          case "$ENGINE" in distro) expect=docker.io ;; *) expect=docker-ce ;; esac
          sudo packaging/tests/check-package.sh dist/smoking-pi_"$DEB_VERSION"_all.deb \
            --version "$DEB_VERSION" --expect-engine "$expect" --start basic --image-tag "$VERSION"

  debian:
    name: Install on Debian ${{ matrix.codename }} ${{ matrix.arch }} (${{ matrix.engine }} engine, no daemon)
    needs: [version, package]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:${{ matrix.codename }}
    strategy:
      fail-fast: false
      matrix:
        codename: [bookworm, trixie]
        arch: [amd64, arm64]
        include:
          - codename: bookworm
            engine: docker.com
          - codename: trixie
            engine: distro
    env:
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - name: What the check needs that a bare image lacks
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg systemd >/dev/null
      - name: Docker's repository (Debian 12 has no Compose v2 of its own)
        if: matrix.engine == 'docker.com'
        run: |
          set -e
          . /etc/os-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $VERSION_CODENAME stable" \
            > /etc/apt/sources.list.d/docker.list
      - name: Install the package, check it, remove it
        run: |
          set -e
          case "$ENGINE" in distro) expect=docker.io ;; *) expect=docker-ce ;; esac
          packaging/tests/check-package.sh dist/smoking-pi_"$DEB_VERSION"_all.deb \
            --version "$DEB_VERSION" --expect-engine "$expect"

  # Not yet exercised by a real run: a test-* tag never takes this job (nor
  # the version-equality check in `host`). The first vX.Y.Z tag after this
  # lands proves both; watch that run.
  attach:
    name: Attach the .deb to the release the maintainer created
    if: startsWith(github.ref_name, 'v')
    needs: [package, host, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to attach the asset to an existing release
    env:
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - name: Upload (release tags only, after every host passed)
        run: |
          set -e
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/smoking-pi_"$DEB_VERSION"_all.deb --clobber --repo "$REPO"
            gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'
          else
            echo "::notice::no GitHub release for $TAG yet; the .deb is the smoking-pi-deb artifact of this run. Create the release, then re-run this job to attach it."
          fi
