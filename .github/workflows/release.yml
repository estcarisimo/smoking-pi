name: Release

# Builds every image the editions declare, for linux/arm64 and linux/amd64,
# and publishes them to ghcr.io/estcarisimo/smoking-pi/<service>:<version>
# on a `vX.Y.Z` tag. This is the only place images are *published*: every
# PR already builds all nine for both architectures (ci.yml, image-build;
# the same packaging/image-context.sh), so a tag publishes what PRs have
# built, and every change is also deployed on the reference Pi before merge
# (AGENTS.md, Process).
#
# Each architecture builds natively on its own runner -- ubuntu-24.04-arm is
# GitHub-hosted and free for public repositories -- because emulating the
# matplotlib/numpy wheels under QEMU takes the better part of an hour. The
# two builds push by digest (no tag), and a merge job stitches the two
# digests into one multi-arch manifest per service, which is what carries
# the tags. docs/packaging.md, "Published images".
#
# After the images, `package` builds the .deb from the tagged tree and
# keeps it as a workflow artifact; `host` and `debian` install it with
# each supported host's own apt (the comment above them says what each
# tier proves). Only once every host passed: `promote` moves `latest` to a
# release (never to a candidate or a test), and `attach` uploads the .deb
# and an evidence file -- the commit, the run, every image digest, the
# package's sha256 -- to the GitHub release the maintainer created for that
# tag (`gh release create`, AGENTS.md). The workflow never creates a
# release itself: publishing stays a human act.
#
# Which tags run, and what each publishes, is packaging/release-version.sh
# (tested by packaging/tests/release-version.bats):
#
#   vX.Y.Z       a release: images X.Y.Z, then `latest`; the .deb attached.
#   vX.Y.Z-rc.N  a release candidate: the same pipeline and the same checks,
#                images X.Y.Z-rc.N, the .deb X.Y.Z~rc.N attached to a GitHub
#                *pre-release* (attach refuses anything else, because the
#                apt repository and the upgrade test skip pre-releases and
#                nothing else). The Raspberry Pi acceptance runs on those
#                artifacts; vX.Y.Z is then tagged on the same commit.
#                docs/release-acceptance.md, "Releasing".
#   test-*       a throwaway, on any branch: images under that name, no
#                `latest`, no version check, no release asset; delete the
#                tag and the package versions afterwards. (workflow_dispatch
#                would only work once the file is on the default branch, so
#                it is not offered.)

on:
  push:
    tags: ['v*', 'test-*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve the image tags
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      version: ${{ steps.resolve.outputs.version }}
      deb_version: ${{ steps.resolve.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version from the git tag (release, candidate or throwaway)
        id: resolve
        run: |
          set -e
          # Its own statement, so a refused tag stops the run here, with
          # the script's reason, before anything is built or pushed.
          out="$(packaging/release-version.sh "$GITHUB_REF_NAME")"
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every shared/modules/*/Dockerfile. packaging/check-images.py (CI)
        # fails when this list, the Dockerfiles and the compose files disagree.
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build context for the service
        id: ctx
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # The same script ci.yml's image builds read, so every PR has
          # already built exactly what the tag builds.
          # Its own statement, so set -e stops here with the script's
          # message: inside `read <<< "$(...)"` a failure is swallowed and
          # the build fails later on an empty context.
          ctx="$(packaging/image-context.sh "$SERVICE")"
          read -r context dockerfile <<< "$ctx"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The file is named by the bare hash: upload-artifact rejects a
          # colon in a path, and the merge job prepends `sha256:` again.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.service }} (multi-arch)
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and tag it
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two digests (amd64, arm64), found: $(ls)"; exit 1; }
          refs=""
          for f in *; do refs="$refs $IMAGE@sha256:$f"; done
          # The version only. `latest` waits for `promote`, after every
          # host has installed and started this very tag.
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$VERSION" $refs
      - name: Both platforms are in the published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
        run: |
          set -e
          out=$(docker buildx imagetools inspect "$IMAGE")
          echo "$out"
          echo "$out" | grep -q 'linux/amd64' || { echo "amd64 missing"; exit 1; }
          echo "$out" | grep -q 'linux/arm64' || { echo "arm64 missing"; exit 1; }

  package:
    name: Build the .deb from the tagged tree
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      deb_version: ${{ needs.version.outputs.deb_version }}
    env:
      DEB_VERSION: ${{ needs.version.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the package
        run: |
          set -e
          # release-version.sh chose it: X.Y.Z, X.Y.Z~rc.N (below X.Y.Z for
          # dpkg), or 0.0.0~test-* (a Debian version starts with a digit).
          deb_version="$DEB_VERSION"
          packaging/deb/build.sh "$deb_version"
          ls -l dist/
          dpkg-deb --info dist/smoking-pi_"$deb_version"_all.deb
      - uses: actions/upload-artifact@v7
        with:
          name: smoking-pi-deb
          path: dist/*.deb
          if-no-files-found: error

  # The supported hosts (docs/packaging.md, "Supported hosts"), each
  # installing the .deb with ITS OWN apt so its own resolver picks the
  # Docker engine, CLI and Compose from the repositories that host has.
  # Two tiers, because GitHub only hosts Ubuntu VMs:
  #
  #  - `host`: Ubuntu 22.04 and 24.04, amd64 and arm64, real VMs with
  #    systemd and a daemon. The check installs the package, then the Basic
  #    edition with the images this run published, waits for its web UI,
  #    enables and starts the unit, stops it, removes the package. Once a
  #    release carries a .deb, it first installs and starts THAT one and
  #    arrives as an upgrade -- the secrets must survive and the containers
  #    must run the new images. The
  #    runner comes with Docker's own engine; the `distro` entries purge it
  #    and drop its repository first, so apt installs Ubuntu's docker.io and
  #    docker-compose-v2 -- the stock path -- and one entry keeps Docker's.
  #  - `debian`: Debian 12 and 13 containers, what Raspberry Pi OS is built
  #    on, on both architectures. No daemon, so no stack: dependency
  #    resolution, the command, the unit, the doctor, and every edition
  #    rendered with THAT Debian's Compose. Debian 12 ships no Compose v2,
  #    so its entry adds Docker's repository first -- the documented
  #    Raspberry Pi OS path; Debian 13 resolves from its own archive.
  #
  # A container is not a Raspberry Pi: the kernel, the Wi-Fi driver, the
  # first hop and boot ordering are only proven by the release acceptance
  # on the reference Pi (docs/packaging.md). What passes here is the
  # package on that OS version, no more.
  host:
    name: Install and start on ${{ matrix.os }} ${{ matrix.arch }} (${{ matrix.engine }} engine)
    needs: [version, merge, package]
    runs-on: ${{ matrix.arch == 'arm64' && format('{0}-arm', matrix.os) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        arch: [amd64, arm64]
        engine: [distro]
        include:
          - os: ubuntu-24.04
            arch: arm64
            engine: docker.com
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - name: Replace the runner's Docker with nothing, so apt installs the distribution's
        if: matrix.engine == 'distro'
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources
          # Only what is installed: dpkg's database also knows names that
          # are not (ubuntu-22.04-arm lists a docker-engine apt cannot purge).
          pkgs=$(dpkg-query -W -f '${db:Status-Status} ${Package}\n' 'docker*' 'containerd*' 'moby-*' 2>/dev/null \
                 | awk '$1 == "installed" { print $2 }' || true)
          # shellcheck disable=SC2086
          [ -z "$pkgs" ] || sudo apt-get purge -y -qq $pkgs >/dev/null
          ! command -v docker || { echo "docker still present: $(command -v docker)"; exit 1; }
      - name: The previous release's package, to upgrade from
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # The newest vX.Y.Z release with a .deb attached, other than this
          # tag's own. None yet (before the first packaged release) is a
          # notice: the check then covers a clean install only.
          mkdir -p previous
          for tag in $(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName'); do
            case "$tag" in v*) ;; *) continue ;; esac
            [ "$tag" != "$GITHUB_REF_NAME" ] || continue
            if gh release download "$tag" --repo "$REPO" --pattern 'smoking-pi_*_all.deb' --dir previous 2>/dev/null; then
              echo "upgrading from $tag: $(ls previous)"; break
            fi
          done
          [ -n "$(ls previous)" ] || echo "::notice::no previous release carries a .deb; clean install only"
      - name: Install the package, start Basic with this run's images, stop, remove
        run: |
          set -e
          case "$ENGINE" in distro) expect=docker.io ;; *) expect=docker-ce ;; esac
          old=$(ls previous/*.deb 2>/dev/null | head -1)
          # ${old:+--upgrade-from "$old"}: nothing when there is no previous
          # package, two words when there is -- the inner quotes keep the
          # path whole, the outer expansion must stay unquoted (SC2086).
          # shellcheck disable=SC2086
          sudo packaging/tests/check-package.sh dist/smoking-pi_"$DEB_VERSION"_all.deb \
            --version "$DEB_VERSION" --expect-engine "$expect" --start basic --image-tag "$VERSION" \
            ${old:+--upgrade-from "$old"}

  debian:
    name: Install on Debian ${{ matrix.codename }} ${{ matrix.arch }} (${{ matrix.engine }} engine, no daemon)
    needs: [version, package]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:${{ matrix.codename }}
    strategy:
      fail-fast: false
      matrix:
        codename: [bookworm, trixie]
        arch: [amd64, arm64]
        include:
          - codename: bookworm
            engine: docker.com
          - codename: trixie
            engine: distro
    env:
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - name: What the check needs that a bare image lacks
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg systemd >/dev/null
      - name: Docker's repository (Debian 12 has no Compose v2 of its own)
        if: matrix.engine == 'docker.com'
        run: |
          set -e
          . /etc/os-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $VERSION_CODENAME stable" \
            > /etc/apt/sources.list.d/docker.list
      - name: Install the package, check it, remove it
        run: |
          set -e
          case "$ENGINE" in distro) expect=docker.io ;; *) expect=docker-ce ;; esac
          packaging/tests/check-package.sh dist/smoking-pi_"$DEB_VERSION"_all.deb \
            --version "$DEB_VERSION" --expect-engine "$expect"

  # `latest` is the last thing a release publishes: the version tag went
  # out in `merge` (the hosts pull it), but `latest` moves only after every
  # host installed and started it. A failed release leaves `latest` on the
  # previous one. Candidates and throwaways never take it.
  promote:
    name: Point latest at ${{ matrix.service }} ${{ needs.version.outputs.version }}
    if: needs.version.outputs.kind == 'release'
    needs: [version, merge, host, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the published manifest latest (no rebuild, same digest)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          want=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}')
          got=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}')
          echo "$IMAGE:latest -> $got"
          [ "$want" = "$got" ] || { echo "latest is $got, expected $want"; exit 1; }

  # A release or a candidate, once every host passed: the .deb and the
  # evidence tying it to this commit go on the GitHub release the
  # maintainer created for the tag. The evidence file is the machine half
  # of the release notes' Validation section (docs/release-acceptance.md):
  # what was built, from what, by which run -- the Pi half is written by
  # hand. The first vX.Y.Z tag after this lands is the first real run of
  # the candidate branch; watch it. It does not wait for `promote` on
  # purpose: a candidate skips `promote`, and a skipped need would skip
  # this job too. The evidence says nothing about `latest`.
  attach:
    name: Attach the .deb and the evidence to the release the maintainer created
    if: needs.version.outputs.kind != 'test'
    needs: [version, merge, package, host, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to attach assets to an existing release
      packages: read    # to read the published digests back
    env:
      KIND: ${{ needs.version.outputs.kind }}
      VERSION: ${{ needs.version.outputs.version }}
      DEB_VERSION: ${{ needs.package.outputs.deb_version }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smoking-pi-deb
          path: dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the evidence
        run: |
          set -e
          deb="dist/smoking-pi_${DEB_VERSION}_all.deb"
          out="dist/smoking-pi_${VERSION}_evidence.md"
          {
            echo "# Smoking Pi $TAG -- release evidence"
            echo
            echo "Written by the release workflow after every install test passed."
            echo "The Raspberry Pi half of the Validation section is written by hand"
            echo "(docs/release-acceptance.md); this is what was built, and from what."
            echo
            echo "- Tag: \`$TAG\` ($KIND)"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release workflow: $RUN_URL"
            echo "- Install tests: every \`host\` job (Ubuntu VMs, Basic started) and every \`debian\` job (Debian 12/13 containers) passed -- this job runs only then"
            echo "- Package: \`$(basename "$deb")\` sha256 \`$(sha256sum "$deb" | cut -d' ' -f1)\`"
            echo
            echo "| Image | Digest (multi-arch manifest) |"
            echo "|---|---|"
            for dockerfile in shared/modules/*/Dockerfile; do
              service=$(basename "$(dirname "$dockerfile")")
              image="$REGISTRY/$service:$VERSION"
              digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
              echo "| \`$image\` | \`$digest\` |"
            done
          } > "$out"
          cat "$out"
      - name: Upload (after every host passed)
        run: |
          set -e
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::no GitHub release for $TAG yet; the .deb is the smoking-pi-deb artifact of this run. Create the release (a candidate: --prerelease), then re-run this job."
            exit 0
          fi
          # The apt repository and the host job's upgrade test skip
          # pre-releases and nothing else: a candidate on a full release
          # would be served by apt and upgraded from, and a release marked
          # pre-release would never be.
          pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease -q .isPrerelease)
          case "$KIND:$pre" in
            candidate:true|release:false) ;;
            candidate:*) echo "::error::$TAG is a candidate but its GitHub release is not a pre-release: gh release edit $TAG --prerelease, then re-run this job"; exit 1 ;;
            *) echo "::error::$TAG is a release but its GitHub release is a pre-release: gh release edit $TAG --prerelease=false, then re-run this job"; exit 1 ;;
          esac
          gh release upload "$TAG" dist/smoking-pi_"$DEB_VERSION"_all.deb dist/smoking-pi_"$VERSION"_evidence.md --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'
