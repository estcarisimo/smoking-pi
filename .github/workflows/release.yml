name: Release

# Builds every image the editions declare, for linux/arm64 and linux/amd64,
# and publishes them to ghcr.io/estcarisimo/smoking-pi/<service>:<version>
# on a `vX.Y.Z` tag. This is the only place images are built by GitHub: PR
# CI keeps the cheap checks (lint, tests, compose guards) and every change is
# built and deployed on the reference Pi before merge (AGENTS.md, Process).
#
# Each architecture builds natively on its own runner -- ubuntu-24.04-arm is
# GitHub-hosted and free for public repositories -- because emulating the
# matplotlib/numpy wheels under QEMU takes the better part of an hour. The
# two builds push by digest (no tag), and a merge job stitches the two
# digests into one multi-arch manifest per service, which is what carries
# the tags. docs/packaging.md, "Published images".
#
# After the images, the `package` job builds the .deb from the tagged tree,
# installs it on the runner as the check a package can pass without a
# Docker daemon (version, packaged paths, the unit verifies, removal keeps
# the state directories), keeps it as a workflow artifact, and on a release
# tag attaches it to the GitHub release the maintainer created for that
# tag (`gh release create`, AGENTS.md). The workflow never creates a
# release itself: publishing stays a human act.
#
# A `test-*` git tag (e.g. test-1a2b3c4, on any branch) exercises the same
# pipeline against a throwaway image tag of that name -- no `latest`, no
# version check, no release asset -- before a real release; delete the tag
# and the package versions afterwards. (workflow_dispatch would only work
# once the file is on the default branch, so it is not offered.)

on:
  push:
    tags: ['v*', 'test-*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve the image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from the git tag (vX.Y.Z is a release, test-* a throwaway)
        id: resolve
        run: |
          set -e
          case "$GITHUB_REF_NAME" in
            test-*)
              case "$GITHUB_REF_NAME" in
                *[!A-Za-z0-9._-]*) echo "refusing '$GITHUB_REF_NAME': not a valid image tag"; exit 1 ;;
              esac
              echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              echo "tags=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          # The package and `smoking-pi version` report CITATION.cff; the
          # images must carry the same number or `SMOKING_PI_VERSION` set
          # from the package would pull nothing.
          cff=$(sed -nE 's/^version: *"?([0-9.]+)"?.*/\1/p' CITATION.cff)
          [ "$cff" = "$version" ] || { echo "tag v$version but CITATION.cff says $cff"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$version latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every shared/modules/*/Dockerfile. packaging/check-images.py (CI)
        # fails when this list, the Dockerfiles and the compose files disagree.
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build context for the service
        id: ctx
        run: |
          # Images that copy shared/modules/common or the exporters build
          # from `shared/`; the rest from their own module directory. The
          # compose files declare the same contexts.
          case '${{ matrix.service }}' in
            ai-insights|alerter|mcp-server|web-admin|smokeping)
              echo "context=shared" >> "$GITHUB_OUTPUT"
              echo "dockerfile=shared/modules/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "context=shared/modules/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
              echo "dockerfile=shared/modules/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The file is named by the bare hash: upload-artifact rejects a
          # colon in a path, and the merge job prepends `sha256:` again.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.service }} (multi-arch)
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-insights
          - alerter
          - config-manager
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and tag it
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          set -e
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two digests (amd64, arm64), found: $(ls)"; exit 1; }
          tag_args=""
          for t in $TAGS; do tag_args="$tag_args -t $IMAGE:$t"; done
          refs=""
          for f in *; do refs="$refs $IMAGE@sha256:$f"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args $refs
      - name: Both platforms are in the published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
        run: |
          set -e
          out=$(docker buildx imagetools inspect "$IMAGE")
          echo "$out"
          echo "$out" | grep -q 'linux/amd64' || { echo "amd64 missing"; exit 1; }
          echo "$out" | grep -q 'linux/arm64' || { echo "arm64 missing"; exit 1; }

  package:
    name: Build, install and attach the .deb
    needs: [version, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only to attach the asset to an existing release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The only authenticated call here is `gh release upload` through
          # GH_TOKEN; git needs no credential left in the checkout.
          persist-credentials: false
      - name: Build the package from the tagged tree
        run: |
          set -e
          # A Debian version must start with a digit; a throwaway tag gets
          # a 0.0.0~ prefix so the builder and dpkg accept it.
          case "$VERSION" in
            [0-9]*) deb_version="$VERSION" ;;
            *) deb_version="0.0.0~$VERSION" ;;
          esac
          echo "DEB_VERSION=$deb_version" >> "$GITHUB_ENV"
          packaging/deb/build.sh "$deb_version"
          ls -l dist/
      - name: Install it, check what a package can prove without Docker, remove it
        run: |
          set -eo pipefail
          # dpkg does not resolve dependencies; docker and compose are not
          # what this checks. Install the metadata dependencies it can.
          sudo apt-get install -y --no-install-recommends python3-yaml whiptail >/dev/null
          sudo dpkg -i --force-depends dist/smoking-pi_"$DEB_VERSION"_all.deb
          # The version the package reports is the tag's (CITATION.cff was
          # checked against it in the version job), the layout is the
          # packaged one, and the images are pinned to this version.
          v=$(smoking-pi version); echo "smoking-pi version: $v"
          case "$DEB_VERSION" in 0.0.0~*) ;; *) [ "$v" = "$VERSION" ] || { echo "package reports $v, tag says $VERSION"; exit 1; } ;; esac
          out=$(smoking-pi paths); echo "$out"
          # Installed at /usr/bin, the command must find the tree in /opt --
          # the first packaged run resolved "one directory up" to / instead.
          echo "$out" | grep -q 'home:     /opt/smoking-pi' || { echo "home is not /opt/smoking-pi"; exit 1; }
          echo "$out" | grep -q 'mode:     packaged' || { echo "not in packaged mode"; exit 1; }
          echo "$out" | grep -q "env:      /etc/smoking-pi/env" || { echo "env file not relocated"; exit 1; }
          echo "$out" | grep -q "/<service>:$DEB_VERSION" || { echo "images not pinned to the package version"; exit 1; }
          grep -qx "SMOKING_PI_VERSION=$DEB_VERSION" /etc/default/smoking-pi
          # /etc/smoking-pi is 0750 root: only root can look inside, so the
          # state checks run as root (an unprivileged `[ -d ]` is false there).
          sudo test -d /etc/smoking-pi/config || { echo "config dir missing"; exit 1; }
          sudo test -d /var/lib/smoking-pi/output || { echo "output dir missing"; exit 1; }
          systemd-analyze verify /lib/systemd/system/smoking-pi.service
          # The doctor's static checks run from /opt: the package carries
          # everything they read. A skipped doctor is a failed check.
          python3 -c 'import yaml' || { echo "python3-yaml not importable by $(command -v python3)"; exit 1; }
          smoking-pi doctor | tee /tmp/doctor.out
          grep -q ' ok, 0 warn, 0 fail' /tmp/doctor.out || { echo "doctor did not pass"; exit 1; }
          # `install` refuses to run over an existing env file -- the guard
          # that stops a reinstall from rotating live secrets.
          sudo mkdir -p /etc/smoking-pi && sudo touch /etc/smoking-pi/env
          ! sudo smoking-pi install --yes 2>/dev/null || { echo "install ran over an existing env file"; exit 1; }
          # Removal keeps the state: apt remove never deletes what a user
          # configured or measured (backlog #6 is the purge policy).
          sudo dpkg -r smoking-pi
          [ ! -e /usr/bin/smoking-pi ] || { echo "CLI left behind"; exit 1; }
          sudo test -f /etc/smoking-pi/env || { echo "removal deleted the env file"; exit 1; }
          sudo test -d /var/lib/smoking-pi/output || { echo "removal deleted the output dir"; exit 1; }
          echo "package OK"
      - uses: actions/upload-artifact@v7
        with:
          name: smoking-pi-deb
          path: dist/*.deb
          if-no-files-found: error
      # Not yet exercised by a real run: a test-* tag never takes this
      # branch (nor the version-equality check above). The first vX.Y.Z
      # tag after this lands proves both; watch that run.
      - name: Attach it to the release the maintainer created (release tags only)
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/smoking-pi_"$DEB_VERSION"_all.deb --clobber
            gh release view "$TAG" --json assets -q '.assets[].name'
          else
            echo "::notice::no GitHub release for $TAG yet; the .deb is the smoking-pi-deb artifact of this run. Create the release, then re-run this job to attach it."
          fi
