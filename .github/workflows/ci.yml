name: CI

# The cheap checks, on every PR and push to main: minutes, no Docker builds.
# Image builds (all ten, arm64+amd64), the docs deploy and, later, the
# package are release work and run from release.yml / docs.yml on a
# `vX.Y.Z` tag. Every change is built and deployed on the reference Pi
# before merge (AGENTS.md, Process), which is where a broken Dockerfile
# surfaces between releases.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Nothing here writes to the repository:
# lint, tests, compose config and the doctor all only read the checkout.
# Without this the token defaults to the repository's setting, which on older
# repos is read-write -- and a compromised action step could push. (CodeQL:
# actions/missing-workflow-permissions.)
permissions:
  contents: read

jobs:
  lint:
    name: Ruff (critical rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff check
        run: |
          uvx ruff check --select E9,F63,F7,F82 \
            shared/modules \
            editions

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n over all shell scripts
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' f; do
              bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
            done
          echo "All shell scripts parse."

  citation:
    name: CITATION.cff valid and current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Validate against the CFF schema
        run: uvx cffconvert@2.0.0 --validate
      - name: Version and date match the newest release in CHANGELOG.md
        run: |
          set -e
          # First "## [X.Y.Z] — YYYY-MM-DD" heading, skipping [Unreleased].
          heading=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md)
          changelog_version=$(echo "$heading" | sed -E 's/^## \[([0-9.]+)\].*/\1/')
          changelog_date=$(echo "$heading" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          cff_version=$(sed -nE 's/^version: *"?([0-9.]+)"?.*/\1/p' CITATION.cff)
          cff_date=$(sed -nE 's/^date-released: *"?([0-9-]+)"?.*/\1/p' CITATION.cff)
          echo "CHANGELOG: $changelog_version ($changelog_date)  CITATION.cff: $cff_version ($cff_date)"
          [ "$cff_version" = "$changelog_version" ] || { echo "CITATION.cff version is stale"; exit 1; }
          [ "$cff_date" = "$changelog_date" ] || { echo "CITATION.cff date-released is stale"; exit 1; }

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # --strict turns every warning (broken link, missing page, dangling
      # anchor) into a failure. docs.yml deploys the same build to Pages.
      - name: Build the documentation site
        run: |
          uv venv .docs-venv
          uv pip install --python .docs-venv/bin/python -r docs/requirements.txt
          .docs-venv/bin/mkdocs build --strict

  compose-config:
    name: Compose config (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [basic, standard, pro]
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        working-directory: editions/${{ matrix.edition }}
        run: |
          # Fill empty template values with dummies so ${VAR:?} checks pass
          cp .env.template .env
          sed -i 's/^\([A-Z_]*\)=$/\1=dummy/' .env
          docker compose config -q
      - name: Relocatable state resolves (standard, pro)
        if: matrix.edition != 'basic'
        working-directory: editions/${{ matrix.edition }}
        run: |
          # docs/packaging.md "Relocatable state": the directories the stack
          # rewrites must follow SMOKING_PI_CONFIG_DIR / _OUTPUT_DIR, and a
          # relocated env file must be accepted. A re-hardcoded mount fails here.
          cp .env /tmp/relocated-env
          out=$(SMOKING_PI_CONFIG_DIR=/etc/smoking-pi/config SMOKING_PI_OUTPUT_DIR=/var/lib/smoking-pi/output \
                docker compose --env-file /tmp/relocated-env config)
          echo "$out" | grep -q 'source: /etc/smoking-pi/config' || { echo "config mount ignores SMOKING_PI_CONFIG_DIR"; exit 1; }
          if [ "${{ matrix.edition }}" = pro ]; then
            echo "$out" | grep -q 'source: /var/lib/smoking-pi/output' || { echo "output mount ignores SMOKING_PI_OUTPUT_DIR"; exit 1; }
          fi
          ! echo "$out" | grep -q 'config-manager/config$' || { echo "a config mount is still hardcoded"; exit 1; }
          ! echo "$out" | grep -q 'config-manager/output$' || { echo "an output mount is still hardcoded"; exit 1; }
      - name: Packaged override drops the code mounts and nothing else (standard, pro)
        if: matrix.edition != 'basic'
        working-directory: editions/${{ matrix.edition }}
        run: |
          # docs/packaging.md "Packaged mode": docker-compose.packaged.yml must
          # remove every bind mount of shared/modules and keep every other
          # volume -- with every profile on, so the gated services count too.
          COMPOSE_PROFILES=influxdb,mcp,alerts,ai,dns,clickhouse python3 ../../packaging/check-packaged-override.py .
          if [ "${{ matrix.edition }}" = pro ]; then
            # The ClickHouse overlay re-adds its init mount; packaged last wins.
            COMPOSE_PROFILES=clickhouse docker compose -f docker-compose.yml -f docker-compose.clickhouse.yml -f docker-compose.packaged.yml config \
              | { ! grep -q 'clickhouse/init'; } || { echo "packaged override must come last"; exit 1; }
          fi
      - name: Images agree across compose, Dockerfiles and the release matrix (pro only)
        if: matrix.edition == 'pro'
        run: |
          # docs/packaging.md "Published images": every built service names
          # ghcr.io/estcarisimo/smoking-pi/<module>:${SMOKING_PI_VERSION:-dev}
          # with pull_policy: missing, every Dockerfile is built somewhere,
          # and release.yml's matrix lists exactly those modules. Renders all
          # three editions itself, so it runs once.
          python3 packaging/check-images.py --repo-root .
      - name: Validate ClickHouse overlay (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: |
          COMPOSE_PROFILES=clickhouse docker compose \
            -f docker-compose.yml -f docker-compose.clickhouse.yml config -q
      - name: Validate MCP profile (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: COMPOSE_PROFILES=mcp docker compose config -q
      - name: Validate alerts profile (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: COMPOSE_PROFILES=alerts docker compose config -q
      - name: Validate dns profile (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: COMPOSE_PROFILES=dns docker compose config -q

  grafana-provisioning:
    name: Grafana dashboards & provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Replaces an inline JSON/YAML validator. The doctor still parses every
      # dashboard and provisioning file, and additionally checks that they
      # agree with each other: datasource uids resolve, plugins are installed,
      # exactly one datasource is default (v2.5.0 shipped two and Grafana
      # refused to start), every dashboard sits under a scanned path, and no
      # panel filters on a measurement or tag the exporters never write.
      - name: Instrumentation doctor (static checks)
        run: |
          pip -q install pyyaml
          python -m doctor --repo-root . --verbose
        env:
          PYTHONPATH: shared/modules/doctor

  cli:
    name: smoking-pi command (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get install -y --no-install-recommends bats
      # Against a stubbed docker: which compose files, in which order, with
      # which env file; what backup/restore/purge/upgrade run and refuse.
      # The real-daemon proof is the deploy on the reference Pi.
      - name: Run the suite
        run: bats packaging/tests/cli.bats
      # show-passwords.sh withholds every secret unless asked; that rule is
      # only real if it is tested.
      - name: Run the show-passwords suite
        run: bats packaging/tests/show-passwords.bats
      # Which tags release.yml accepts and what each publishes: a pushed
      # tag publishes images at once, so the shapes are proven here.
      - name: Run the release-version suite
        run: bats packaging/tests/release-version.bats

  homebrew:
    name: Homebrew formula (parses; sha256 is the tarball's)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Mac in CI: this proves what can be proven without one.
      - run: packaging/homebrew/check.sh

  apt-repo:
    name: apt repository (built, signed with a throwaway key, consumed by apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build two package versions and the repository
        run: |
          set -e
          sudo apt-get install -y -qq --no-install-recommends dpkg-dev apt-utils gnupg >/dev/null
          packaging/deb/build.sh 0.0.0~ci1 && packaging/deb/build.sh 0.0.0~ci2
          # A key for this run only; docs.yml uses the APT_SIGNING_KEY secret.
          export GNUPGHOME; GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --passphrase '' --quick-gen-key 'Smoking Pi CI <ci@invalid>' ed25519 sign never
          APT_SIGNING_KEY=$(gpg --batch --armor --export-secret-keys) packaging/apt/build-repo.sh repo dist/*.deb
          ls repo
      - name: apt on this host accepts it and installs the newest version from it
        run: |
          set -e
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 repo/smoking-pi.gpg /etc/apt/keyrings/smoking-pi.gpg
          echo "deb [signed-by=/etc/apt/keyrings/smoking-pi.gpg] file:$PWD/repo ./" | sudo tee /etc/apt/sources.list.d/smoking-pi.list
          sudo apt-get update -qq
          apt-cache policy smoking-pi | tee policy.out
          grep -q 'Candidate: 0.0.0~ci2' policy.out || { echo "apt does not see the newest version"; exit 1; }
          # The runner's Docker satisfies the dependencies; the point here
          # is that apt takes the package from the repository, verified.
          sudo apt-get install -y -qq --no-install-recommends smoking-pi >/dev/null
          smoking-pi version
          sudo apt-get remove -y -qq smoking-pi >/dev/null

  module-tests:
    name: Module unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Discover and run tests for every module that has them
        run: |
          set -e
          found=0
          for dir in shared/modules/*/ tools/*/; do
            [ -d "$dir/tests" ] || continue
            found=1
            echo "═══ Testing $dir ═══"
            python -m venv /tmp/module-venv
            # shellcheck disable=SC1091
            . /tmp/module-venv/bin/activate
            pip -q install --upgrade pip
            if [ -f "$dir/tests/requirements.txt" ]; then
              pip -q install -r "$dir/tests/requirements.txt"
            else
              # Fall back to installing the module itself (full deps) + pytest
              pip -q install -e "$dir" pytest
            fi
            (cd "$dir" && pytest tests/ -ra -q)
            deactivate
            rm -rf /tmp/module-venv
          done
          [ "$found" = "1" ] || { echo "No module tests found — failing loudly rather than passing silently"; exit 1; }


  # Every image, both architectures, on every PR -- built, never pushed.
  # Decision of 2026-09-23: a check that can run on a PR runs on the PR,
  # because what is deferred to the tag becomes a pile of release blockers.
  # Until then no PR built an image, so a broken Dockerfile (a module added
  # without its COPY line, a base image that stopped resolving) surfaced
  # only when tagging. All ten, not only the changed ones: five images
  # build from `shared/` and copy `common/`, so "which images did this
  # change" is not a question a path filter answers, and a required check
  # that a path filter skipped stays pending forever.
  image-build:
    name: Image build (${{ matrix.service }}, ${{ matrix.arch }})
    # Native runners, as release.yml: an arm64 build under QEMU takes an
    # hour for matplotlib alone, and the Pi is arm64.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # The list release.yml publishes; packaging/check-images.py fails
        # when it and the Dockerfiles disagree.
        service:
          - ai-insights
          - alerter
          - config-manager
          - dns-observer
          - grafana
          - influxdb
          - mcp-server
          - postgres
          - smokeping
          - web-admin
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build context for the service
        id: ctx
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # Its own statement, so set -e stops here with the script's
          # message: inside `read <<< "$(...)"` a failure is swallowed and
          # the build fails later on an empty context.
          ctx="$(packaging/image-context.sh "$SERVICE")"
          read -r context dockerfile <<< "$ctx"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          # One cache scope per image and architecture, so an unchanged
          # image rebuilds from cache in seconds rather than minutes.
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

  # The one name the branch ruleset requires, instead of eighteen: it
  # passes only when every image built. `if: always()` so a failed build
  # fails this check rather than skipping it (a skipped required check
  # counts as passing).
  images:
    name: Images build (all)
    needs: image-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every image built
        env:
          RESULT: ${{ needs.image-build.result }}
        run: |
          echo "image-build: $RESULT"
          [ "$RESULT" = success ]
