name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff (critical rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff check
        run: |
          uvx ruff check --select E9,F63,F7,F82 \
            shared/modules \
            editions

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n over all shell scripts
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' f; do
              bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
            done
          echo "All shell scripts parse."

  compose-config:
    name: Compose config (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [basic, standard, pro]
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        working-directory: editions/${{ matrix.edition }}
        run: |
          # Fill empty template values with dummies so ${VAR:?} checks pass
          cp .env.template .env
          sed -i 's/^\([A-Z_]*\)=$/\1=dummy/' .env
          docker compose config -q
      - name: Validate ClickHouse overlay (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: |
          COMPOSE_PROFILES=clickhouse docker compose \
            -f docker-compose.yml -f docker-compose.clickhouse.yml config -q
      - name: Validate MCP profile (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: COMPOSE_PROFILES=mcp docker compose config -q
      - name: Validate alerts profile (pro only)
        if: matrix.edition == 'pro'
        working-directory: editions/pro
        run: COMPOSE_PROFILES=alerts docker compose config -q

  grafana-provisioning:
    name: Grafana dashboards & provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Replaces an inline JSON/YAML validator. The doctor still parses every
      # dashboard and provisioning file, and additionally checks that they
      # agree with each other: datasource uids resolve, plugins are installed,
      # exactly one datasource is default (v2.5.0 shipped two and Grafana
      # refused to start), every dashboard sits under a scanned path, and no
      # panel filters on a measurement or tag the exporters never write.
      - name: Instrumentation doctor (static checks)
        run: |
          pip -q install pyyaml
          python -m doctor --repo-root . --verbose
        env:
          PYTHONPATH: shared/modules/doctor

  module-tests:
    name: Module unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Discover and run tests for every module that has them
        run: |
          set -e
          found=0
          for dir in shared/modules/*/; do
            [ -d "$dir/tests" ] || continue
            found=1
            echo "═══ Testing $dir ═══"
            python -m venv /tmp/module-venv
            # shellcheck disable=SC1091
            . /tmp/module-venv/bin/activate
            pip -q install --upgrade pip
            if [ -f "$dir/tests/requirements.txt" ]; then
              pip -q install -r "$dir/tests/requirements.txt"
            else
              # Fall back to installing the module itself (full deps) + pytest
              pip -q install -e "$dir" pytest
            fi
            (cd "$dir" && pytest tests/ -ra -q)
            deactivate
            rm -rf /tmp/module-venv
          done
          [ "$found" = "1" ] || { echo "No module tests found — failing loudly rather than passing silently"; exit 1; }

  docker-build:
    name: Docker build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [config-manager, web-admin, grafana, smokeping]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        working-directory: shared/modules/${{ matrix.module }}
        run: docker build -t ci-${{ matrix.module }} .
