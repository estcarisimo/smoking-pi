name: Docs

# Publishes GitHub Pages: the MkDocs site and, under /apt, the apt
# repository holding every release's .deb (docs/packaging.md, "The apt
# repository"). One artifact, because Pages serves one; so this runs when
# the Release workflow has finished for a vX.Y.Z tag -- after `attach` has
# put that release's .deb on the GitHub release the repository is built
# from -- and not on the tag push, which would race it. The site describes
# the released version, not main.
#
# The repository is signed with APT_SIGNING_KEY (an Actions secret, the
# ASCII-armored private key). Without it the site is published with no
# /apt at all: an unsigned repository is refused by apt, and publishing
# one would only teach people to add [trusted=yes].
#
# The Pages source must be "GitHub Actions" in the repository settings.
# Pull requests only build (CI job "Docs build (strict)"); the deployment
# needs the pages permissions, which are granted here and nowhere else.
# `workflow_dispatch` republishes from whatever ref it is run on, for a docs
# fix that cannot wait for the next release; the apt repository is rebuilt
# from the releases either way, so it never goes missing.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # A successfully finished Release run, or a manual run. Whether that
    # run was for a release tag is decided from the commit itself below --
    # `workflow_run.head_branch` is not relied on for a tag push -- and a
    # test-* tag's run ends with a visible skip, never a silent one.
    #
    # workflow_run runs with this repository's secrets whatever triggered
    # the run before it, and this job checks out and executes that run's
    # commit (mkdocs, its plugins, build-repo.sh). That is safe only
    # because Release runs on tag pushes, which only maintainers can make
    # -- so it is stated here rather than left implied (code scanning
    # alert #75): a Release run that was not a push, or that came from
    # another repository, is never built or published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the Release run built; a manual run takes its own ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-tags: true
          persist-credentials: false
      - name: Is this a release?
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -e
          tags=$(git tag --points-at HEAD)
          echo "event: $EVENT; workflow_run.head_branch: ${HEAD_BRANCH:-n/a}; tags at HEAD: ${tags:-none}"
          if [ "$EVENT" = workflow_dispatch ] || echo "$tags" | grep -q '^v'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not a vX.Y.Z release (tags at HEAD: ${tags:-none}); nothing published"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.tag.outputs.publish == 'true'
        with:
          python-version: "3.12"
      - name: Build the documentation site
        if: steps.tag.outputs.publish == 'true'
        run: |
          uv venv .docs-venv
          uv pip install --python .docs-venv/bin/python -r docs/requirements.txt
          .docs-venv/bin/mkdocs build --strict
      - name: Every release's package, from the GitHub releases
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p debs
          # --limit 100: releases beyond the hundredth would drop off the
          # repository; raise it before that day.
          for tag in $(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName'); do
            case "$tag" in v*) ;; *) continue ;; esac
            gh release download "$tag" --repo "$REPO" --pattern 'smoking-pi_*_all.deb' --dir debs --clobber 2>/dev/null \
              && echo "$tag: $(find debs -name '*.deb' | wc -l) package(s) so far" \
              || echo "$tag: no .deb attached (a release before packaging)"
          done
          ls -l debs
      # The signing key reaches two steps, this one and the one that signs,
      # and no other: it used to be in the job's env, readable by every
      # step, mkdocs and its plugins included. This step passes on only a
      # yes or no, for the `if:`s that branch on it.
      - name: Is there a signing key?
        id: key
        if: steps.tag.outputs.publish == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: echo "present=$([ -n "$APT_SIGNING_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: The apt repository under /apt, signed
        if: steps.tag.outputs.publish == 'true' && steps.key.outputs.present == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -e
          sudo apt-get install -y -qq --no-install-recommends dpkg-dev apt-utils gnupg >/dev/null
          [ -n "$(find debs -name '*.deb')" ] || { echo "::warning::no release carries a .deb yet; /apt not published"; exit 0; }
          packaging/apt/build-repo.sh site/apt debs/*.deb
      - name: No signing key, no repository
        if: steps.tag.outputs.publish == 'true' && steps.key.outputs.present != 'true'
        run: echo "::warning::APT_SIGNING_KEY is not set; the site is published without /apt (docs/packaging.md, The apt repository)"
      - name: Upload the site
        if: steps.tag.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
