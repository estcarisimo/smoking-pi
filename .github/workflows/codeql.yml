name: CodeQL

# Code scanning as a workflow ("advanced setup"), replacing GitHub's default
# setup. Default setup only analyzes PRs that target the default branch, so
# a stacked PR -- based on another PR's branch, which this repository merges
# routinely -- got every other check and no CodeQL at all, with nothing
# saying so (#102). It also cannot be a required check in the usual way.
# Decision of 2026-09-23: a check that can run on a PR runs on the PR.
#
# The languages and categories are the ones default setup used, so the
# alert history carries over: an alert keeps its number instead of being
# closed and reopened as a new one. `build-mode: none` for all four: none
# of them is compiled.
#
# Default setup must be switched off when this merges (Settings -> Code
# security -> CodeQL analysis -> Switch to advanced): while it is on, GitHub
# refuses uploads from a workflow, and every run of this one fails.
on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately: PRs based on any branch.
  pull_request:
  schedule:
    # Weekly, as default setup did: new queries find old code.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflows themselves; ruby: the Homebrew formula.
        language: [actions, javascript-typescript, python, ruby]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # The one name the branch ruleset requires. `if: always()` so a failed
  # or cancelled analysis fails this check instead of skipping it (a
  # skipped required check counts as passing). This proves the analysis
  # ran; whether it found something new is the separate "CodeQL" check
  # GitHub posts from the results, which the ruleset can require as well.
  codeql:
    name: CodeQL analysis (all)
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every language analyzed
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          echo "analyze: $RESULT"
          [ "$RESULT" = success ]
