# Dependabot version updates.
#
# This repo has three ecosystems and seventeen places they live: seven Python
# modules, nine Dockerfiles, and the Actions workflow. One entry per directory
# would open seventeen PRs a week at a solo maintainer, which is how Dependabot
# gets muted and then ignored. So: `directories` globs instead of one block
# each, groups so a week's updates arrive as one PR per ecosystem, and a low
# open-PR ceiling.
#
# Security updates are separate and NOT governed by this file — they are
# enabled in Settings → Code security and always open individually, which is
# what you want for a CVE.
version: 2

updates:
  # The workflow's own actions. Cheap, and a stale checkout@v4 is the kind of
  # thing nobody notices until a deprecation breaks CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Python modules: alerter, ai-insights, config-manager, doctor, mcp-server,
  # smokeping-exporters, web-admin.
  - package-ecosystem: pip
    directories:
      - "/shared/modules/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: individually they are noise, and the batch
      # is still small enough to read.
      python-minor-patch:
        update-types: ["minor", "patch"]
      # Majors stay separate — they are the ones that need a human.
      python-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # Base images. python:3.14-slim, postgres, grafana, influxdb, and the
  # LinuxServer smokeping image.
  #
  # Majors are split out for the same reason as the Python ecosystem above,
  # and the lesson arrived expensively. The first grouped run put a routine
  # python 3.11->3.14 bump in the SAME PR as postgres:15->18, and CI passed
  # it: PR CI built no postgres image (today it builds none at all -- the
  # release workflow builds all nine from the tag), and no CI job has an
  # existing data volume. A stateful major cannot be validated by a green
  # build, so it must never travel with bumps that can.
  - package-ecosystem: docker
    directories:
      - "/shared/modules/*"
    # inference has its own block below, with Python held at 3.13.
    exclude-paths:
      - "/shared/modules/inference"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-major:
        update-types: ["major"]
    ignore:
      # postgres and influxdb hold the two stateful volumes here. A major
      # bump is a data migration, not a version string: PG18 both refuses to
      # start on a PG15 directory AND relocated its default PGDATA to
      # /var/lib/postgresql/18/docker, so with our mount it reports
      # "uninitialized" and would initialize an EMPTY cluster while the real
      # data sits orphaned in the volume. Postgres is this project's config
      # source of truth, so that failure presents as every target vanishing
      # from a container reporting healthy. Do these deliberately, with a
      # dump first -- see docs/upgrades.md
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # InfluxDB migrates on minors too: 2.9 hashed every stored token on
      # first start (one-way), and sync-influx-token.sh, which parsed the
      # token column, would have written INFLUX_TOKEN=admin (#157). A green
      # CI has no InfluxDB volume, so minors are done by hand as well.
      - dependency-name: "influxdb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(docker)"

  # The inference image, on its own so Python can be held at 3.13 without
  # holding the other images (the block above excludes this directory).
  # ruptures, which Jitterbug requires, publishes no cp314 wheels (latest
  # 1.1.10, 2026-10-18: cp39-cp313 only, aarch64 and x86_64), and building it
  # from source would need a compiler in the image. Dependabot's #384
  # (3.13-slim -> 3.14-slim) would have broken that build.
  # LIFT THIS when ruptures publishes cp314 manylinux wheels for both
  # architectures: check https://pypi.org/project/ruptures/#files, then bump
  # shared/modules/inference/Dockerfile and delete the ignore.
  - package-ecosystem: docker
    directory: "/shared/modules/inference"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-major:
        update-types: ["major"]
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
    commit-message:
      prefix: "chore(docker)"
