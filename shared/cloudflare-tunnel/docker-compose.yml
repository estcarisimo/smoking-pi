# Cloudflare Tunnel for Remote Access
# Provides secure remote access to SmokePing services

services:
  cloudflared:
    # Pinned (was :latest); bump deliberately when upgrading
    image: cloudflare/cloudflared:2026.5.0
    container_name: smokeping-tunnel
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Error: CLOUDFLARE_TUNNEL_TOKEN required}
    command: tunnel run
    restart: unless-stopped
    networks:
      - tunnel-net

networks:
  tunnel-net:
    name: smokeping-tunnel
    external: true