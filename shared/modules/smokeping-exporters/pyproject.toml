[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokeping-exporters"
version = "2.0.0"
description = "SmokePing RRD to Time-Series Database Exporters (ClickHouse, InfluxDB)"
readme = {content-type = "text/plain", text = "SmokePing RRD to Time-Series Database Exporters"}
license = { text = "MIT" }
authors = [
    { name = "SmokePing Team", email = "admin@smoking-pi.dev" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    # Time-series database clients
    "clickhouse-connect>=0.6.0",
    "influxdb-client>=1.36.0",
    
    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Utilities
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.65.0",
    
    # Logging and monitoring
    "structlog>=23.1.0",
    "prometheus-client>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "types-python-dateutil>=2.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "types-python-dateutil>=2.8.0",
]

[project.scripts]
rrd2clickhouse = "rrd2clickhouse:main"
rrd2influx = "rrd2influx:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# NOTE: critical-error subset so CI stays green; expand as code is cleaned up.
select = [
    "E9", "F63", "F7", "F82",
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false