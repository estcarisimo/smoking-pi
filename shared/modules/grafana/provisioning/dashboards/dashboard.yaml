# Single dashboard provider for all InfluxDB dashboards.
#
# One provider walks this directory recursively; foldersFromFilesStructure
# maps each first-level subdirectory (overview/, cpe/, side-by-side-pings/,
# individual-pings/, dns-resolution-times/) to a Grafana folder. Do NOT add
# additional providers pointing at the subdirectories: the recursive walk of
# the parent would claim the same JSON files twice and cause duplicate-UID
# provisioning errors.
#
# allowUiUpdates is false on purpose: with updateIntervalSeconds set, edits
# made in the UI would be silently reverted on the next reload anyway. Edit
# the JSON files in the repo instead (the directory is bind-mounted, so saved
# changes appear within 5 min).
apiVersion: 1

providers:
  - name: SmokePing
    type: file
    disableDeletion: true
    allowUiUpdates: false
    # 300, not 30: each tick re-walks the provisioning directory and rebuilds
    # the search index. Dashboards are edited in the repo, not minute to
    # minute, so five minutes is ample and costs a fraction of the CPU.
    updateIntervalSeconds: 300
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
