# Single dashboard provider for all InfluxDB dashboards.
#
# One provider walks this directory recursively; foldersFromFilesStructure
# maps each first-level subdirectory to a Grafana folder, with the directory
# name as the folder's title: Connection (the Overview and Connectivity &
# Quality), Targets (one target, every target of a category, HTTP by
# version, targets by service), Network (Wi-Fi, the ISP gateway), DNS
# (resolvers, the wizard) and Advanced (Diagnostics: are the collectors
# writing, which series stopped, what the services record about themselves
# -- internals, off the main path; Internet Topology, experimental: the path
# meter's traces, every destination side by side).
# Renaming a directory moves its dashboards and leaves the old folder behind,
# empty: `smoking-pi upgrade` deletes those (RETIRED_FOLDERS in
# cli/lib/lifecycle.sh). Grafana matches folder titles case-insensitively:
# a new name must not be an old slug in other letters (Home reused `home`,
# and stayed lowercase, on the 2.34.0 candidate).
# Do NOT add
# additional providers pointing at the subdirectories: the recursive walk of
# the parent would claim the same JSON files twice and cause duplicate-UID
# provisioning errors.
#
# allowUiUpdates is false on purpose: with updateIntervalSeconds set, edits
# made in the UI would be silently reverted on the next reload anyway. Edit
# the JSON files in the repo instead (the directory is bind-mounted, so saved
# changes appear within 5 min).
apiVersion: 1

providers:
  - name: SmokePing
    type: file
    disableDeletion: true
    allowUiUpdates: false
    # 300, not 30: each tick re-walks the provisioning directory and rebuilds
    # the search index. Dashboards are edited in the repo, not minute to
    # minute, so five minutes is ample and costs a fraction of the CPU.
    updateIntervalSeconds: 300
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
