apiVersion: 1
envInterpolation: true

datasources:
  # Official Grafana ClickHouse datasource. This plugin takes host/port in
  # jsonData — it ignores the top-level `url` field that most datasources use,
  # and reports "invalid server host" if you only set that.
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    # isDefault is resolved per mode: in clickhouse mode the entrypoint builds
    # a provisioning tree containing only this file, so nothing competes.
    isDefault: true
    editable: false

    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: 8123
      protocol: http
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DB}
      tlsSkipVerify: true
      dialTimeout: 10
      queryTimeout: 60

    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: PostgreSQL
    uid: postgresql-targets
    type: postgres
    access: proxy
    url: postgres:5432
    user: smokeping
    editable: false

    jsonData:
      database: smokeping_targets
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1300
      timescaledb: false
      
    secureJsonData:
      password: ${POSTGRES_PASSWORD}