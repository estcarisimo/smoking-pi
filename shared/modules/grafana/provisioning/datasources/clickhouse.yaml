apiVersion: 1
envInterpolation: true

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    isDefault: true
    editable: false
    database: ${CLICKHOUSE_DB}

    jsonData:
      # ClickHouse specific settings
      defaultDatabase: ${CLICKHOUSE_DB}
      username: ${CLICKHOUSE_USER}
      database: ${CLICKHOUSE_DB}
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: true
      
      # Query settings
      timeout: 30
      queryTimeout: 60
      dialTimeout: 10
      maxIdleConns: 2
      maxOpenConns: 5
      connMaxLifetime: 3600

    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: ClickHouse-Alternative
    uid: clickhouse-alt
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    isDefault: false
    editable: false
    database: ${CLICKHOUSE_DB}
    basicAuth: true
    basicAuthUser: ${CLICKHOUSE_USER}

    jsonData:
      defaultDatabase: ${CLICKHOUSE_DB}
      
    secureJsonData:
      basicAuthPassword: ${CLICKHOUSE_PASSWORD}

  - name: PostgreSQL
    uid: postgresql-targets
    type: postgres
    access: proxy
    url: postgres:5432
    user: smokeping
    editable: false

    jsonData:
      database: smokeping_targets
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1300
      timescaledb: false
      
    secureJsonData:
      password: ${POSTGRES_PASSWORD}