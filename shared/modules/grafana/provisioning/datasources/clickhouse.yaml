apiVersion: 1
envInterpolation: true

datasources:
  # Official Grafana ClickHouse datasource. This plugin takes host/port in
  # jsonData — it ignores the top-level `url` field that most datasources use,
  # and reports "invalid server host" if you only set that.
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    # MUST stay false here. In influxdb mode editions/pro bind-mounts this
    # directory read-only, so this file is provisioned alongside influxdb.yaml
    # (which is default) and Grafana refuses to start outright if two
    # datasources claim default. ClickHouse mode needs it true, so the
    # entrypoint flips it while building its own writable provisioning tree.
    isDefault: false
    editable: false

    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: 8123
      protocol: http
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DB}
      tlsSkipVerify: true
      dialTimeout: 10
      queryTimeout: 60

    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: PostgreSQL
    uid: postgresql-targets
    type: postgres
    access: proxy
    url: postgres:5432
    user: smokeping
    editable: false

    jsonData:
      database: smokeping_targets
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1300
      timescaledb: false
      
    secureJsonData:
      password: ${POSTGRES_PASSWORD}