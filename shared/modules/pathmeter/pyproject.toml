[project]
name = "smoking-pi-pathmeter"
version = "1.0.0"
description = "Experimental: the path to every measured destination, by Paris traceroute"
requires-python = ">=3.11"
# The Dockerfile lists these dependencies again: keep the two in step.
dependencies = [
    "dnspython>=2.6",
    "influxdb-client>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]
exclude = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", ".."]
