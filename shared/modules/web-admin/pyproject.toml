[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokeping-web-admin"
version = "2.0.0"
description = "SmokePing Web Administration Interface with Modern Python Stack"
# readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "SmokePing Team", email = "admin@smoking-pi.dev" }
]
maintainers = [
    { name = "SmokePing Team", email = "admin@smoking-pi.dev" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    # Core web framework
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-login>=0.6.2",
    "flask-caching>=2.0.2",
    "gunicorn>=21.2.0",
    
    # Data validation and serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database and ORM
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    
    # HTTP and networking
    "requests>=2.31.0",
    "httpx>=0.25.0",
    
    # Configuration and templating
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
    "toml>=0.10.2",
    
    # Docker integration
    "docker>=6.1.3",
    
    # Background tasks
    "apscheduler>=3.10.1",
    
    # Utilities
    "tqdm>=4.65.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
security = [
    "flask-basicauth>=0.2.0",
    "flask-wtf>=1.2.0",
    "cryptography>=41.0.0",
    "python-jose>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/estcarisimo/smoking-pi"
Repository = "https://github.com/estcarisimo/smoking-pi"
Documentation = "https://github.com/estcarisimo/smoking-pi/blob/main/README.md"
"Bug Reports" = "https://github.com/estcarisimo/smoking-pi/issues"

[project.scripts]
smokeping-web-admin = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true
extend-exclude = '''
/(
    migrations
    | .venv
    | venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# NOTE: critical-error subset so CI stays green; expand as code is cleaned up.
select = [
    "E9", "F63", "F7", "F82",
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex (let developers decide)
    "ARG002", # unused method argument
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused import
"migrations/*.py" = ["ARG001", "ARG002"]  # unused arguments in migrations

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "APScheduler.*",
    "beautifulsoup4.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"