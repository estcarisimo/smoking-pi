[project]
name = "smoking-pi-inference"
version = "1.0.0"
description = "Experimental: persistent congestion (Jitterbug) and loss degradation (BCP) per target"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.40",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# The detectors themselves. Jitterbug's `bcp` extra brings bayesian-changepoint
# and torch; the image installs torch from the CPU-only index. Tests fake both.
detect = [
    "jitterbug-inference[bcp]>=2.3",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]
exclude = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", ".."]
