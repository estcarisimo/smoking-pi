# SmokePing Targets Configuration Template
# This file defines all active monitoring targets
#
# Generated automatically by bootstrap - modify as needed

active_targets:
  # Popular websites for basic connectivity testing
  top_sites:
    - name: Google
      host: google.com
      title: Google
      probe: FPing
      category: top_sites
    - name: Facebook
      host: facebook.com
      title: Facebook
      probe: FPing
      category: top_sites
    - name: Amazon
      host: amazon.com
      title: Amazon
      probe: FPing
      category: top_sites
    - name: NYT
      host: nytimes.com
      title: NYT
      probe: FPing
      category: top_sites
    - name: Apple
      host: apple.com
      title: Apple
      probe: FPing
      category: top_sites

  # Netflix Open Connect Appliances - populated dynamically
  netflix_oca: []

  # Public DNS resolvers
  dns_resolvers:
    - name: GoogleDNS
      host: 8.8.8.8
      title: Google DNS
      probe: DNS
      lookup: google.com
      category: dns_resolvers
    - name: CloudflareDNS
      host: 1.1.1.1
      title: Cloudflare DNS
      probe: DNS
      lookup: cloudflare.com
      category: dns_resolvers
    - name: Quad9DNS
      host: 9.9.9.9
      title: Quad9 DNS
      probe: DNS
      lookup: quad9.net
      category: dns_resolvers

  # Custom targets - add your own here
  custom:
    - name: uba_ar
      host: uba.ar
      title: uba.ar
      probe: FPing
      category: custom

  # HTTPS fetch time per protocol version. Three sites that serve all of
  # HTTP/1.1, 2 and 3; the _h1/_h2/_h3 suffix is how the exporters tag
  # the version (probe_type), so keep it when adding your own.
  http:
    - name: Google_h1
      host: www.google.com
      title: Google HTTP/1.1
      probe: CurlHTTP1
      category: http
    - name: Google_h2
      host: www.google.com
      title: Google HTTP/2
      probe: CurlHTTP2
      category: http
    - name: Google_h3
      host: www.google.com
      title: Google HTTP/3
      probe: CurlHTTP3
      category: http
    - name: Cloudflare_h1
      host: www.cloudflare.com
      title: Cloudflare HTTP/1.1
      probe: CurlHTTP1
      category: http
    - name: Cloudflare_h2
      host: www.cloudflare.com
      title: Cloudflare HTTP/2
      probe: CurlHTTP2
      category: http
    - name: Cloudflare_h3
      host: www.cloudflare.com
      title: Cloudflare HTTP/3
      probe: CurlHTTP3
      category: http
    - name: Facebook_h1
      host: www.facebook.com
      title: Facebook HTTP/1.1
      probe: CurlHTTP1
      category: http
    - name: Facebook_h2
      host: www.facebook.com
      title: Facebook HTTP/2
      probe: CurlHTTP2
      category: http
    - name: Facebook_h3
      host: www.facebook.com
      title: Facebook HTTP/3
      probe: CurlHTTP3
      category: http

  # TCP handshake time to port 443 — the transport baseline under the HTTP
  # probes above.
  tcp:
    - name: Google_tcp443
      host: www.google.com
      title: Google TCP 443
      probe: TCPPing
      category: tcp
    - name: Cloudflare_tcp443
      host: www.cloudflare.com
      title: Cloudflare TCP 443
      probe: TCPPing
      category: tcp
    - name: Facebook_tcp443
      host: www.facebook.com
      title: Facebook TCP 443
      probe: TCPPing
      category: tcp

# Metadata about the configuration
metadata:
  last_updated: "1970-01-01T00:00:00"
  total_targets: 21
  version: "1.0"
  created_by: "bootstrap"