# Service taxonomy: what kind of service a measured target is.
#
# A target's `category` (top_sites, netflix_oca, dns_resolvers, ...) is a
# technical probe bucket: it picks the SmokePing section and the InfluxDB
# tag, and it says nothing about the service. The labels here live beside
# it. See docs/taxonomy.md.
#
# This is the one copy. It ships in the config-manager image, is never
# copied into the per-install config directory and is not edited per
# install: a per-target correction is an override (`smoking-pi taxonomy
# set`), stored in PostgreSQL.
#
# The vocabulary and the rules are the project's own. External lists were
# consulted as evidence for which hostnames belong to which service, and
# `source` on each rule says which one; none of their files is copied here
# (AdGuard HostlistsRegistry is GPL-3.0, nDPI is LGPL, Cloudflare Radar's
# categories are CC BY-NC).
#
# Resolution, most specific first: `name` (the target's name, or its base
# name without the _h1/_h2/_h3/_tcp443/_icmp probe suffix) > `host_suffix`
# (the longest suffix that matches the host; an IP address matches only
# itself) > `category` (the technical bucket). Nothing matched: unknown.
#
# Label by host, not by name. The DNS wizard adopts the same public hosts
# under its own names (W_amazon_com_h2 for www.amazon.com), so a rule on
# the template's name labels one copy and leaves the other unknown. A
# `name` rule is for a target whose host says nothing (a private address,
# a host shared by unrelated services); the seed needs none.
#
# A rule: match (exactly one of name / host_suffix / category; a string or
# a list of strings), service (optional: absent means the target's title),
# categories (one or more ids from `categories`), source (manual | adguard
# | ndpi | radar: the evidence used), confidence (high | medium | low),
# since (the date the rule was written or last checked), note (optional).

version: 2

categories:
  video:
    label: Video streaming
    description: Can the line hold a video stream without rebuffering?
  audio:
    label: Audio streaming
    description: Does music or podcast playback start and keep playing?
  gaming:
    label: Gaming
    description: Is latency low and steady enough for online play and game stores?
  realtime_comms:
    label: Calls and conferencing
    description: Are voice and video calls free of loss and jitter?
  messaging:
    label: Messaging
    description: Do messages and their notifications get through promptly?
  social:
    label: Social media
    description: Do feeds, images and short videos load quickly?
  web_search:
    label: Web search
    description: Does search answer fast, the first step of most browsing?
  web:
    label: Websites
    description: Does ordinary browsing work (news, reference, shopping, company sites)?
  ai_assistant:
    label: AI assistant
    description: Can an AI assistant (chat, code, voice) be reached and answer?
  cloud_saas:
    label: Cloud and SaaS
    description: Are cloud storage, office suites and work tools reachable?
  software_update:
    label: Software updates
    description: Can operating system, app and game updates download?
  cdn:
    label: Content delivery network
    description: How close and how steady is the nearest CDN edge?
  dns:
    label: DNS
    description: Do name lookups answer, and how fast?
  connectivity:
    label: Connectivity
    description: Is the local network and the way out to the Internet up?
  ads_analytics:
    label: Ads and analytics
    description: Are ad and analytics endpoints slowing pages down?
  academic:
    label: Academic and research
    description: Are universities and research networks reachable?
  unknown:
    label: Unknown
    description: No rule says what this service is yet.

rules:
  # --- Websites -------------------------------------------------------------
  # Ordinary browsing. The shipped Amazon, NYT and Apple targets are these
  # sites; each is also `cdn` because what answers is a CDN edge.
  - match: {host_suffix: [amazon.com]}
    service: Amazon
    categories: [web, cdn]
    source: manual
    confidence: medium
    since: 2026-10-23
    note: The retail site, served from CloudFront; it measures a CloudFront edge.
  - match: {host_suffix: [nytimes.com]}
    service: The New York Times
    categories: [web, cdn]
    source: manual
    confidence: medium
    since: 2026-10-23
    note: A news site served from Fastly; it measures a Fastly edge.
  - match: {host_suffix: [apple.com]}
    service: Apple
    categories: [web, cdn]
    source: manual
    confidence: medium
    since: 2026-10-23
    note: apple.com is served from Apple's and Akamai's edges; longer apple.com suffixes (music, push, updates) win over it.
  - match: {host_suffix: [adobe.com]}
    service: Adobe
    categories: [web, cloud_saas]
    source: manual
    confidence: medium
    since: 2026-10-23
    note: acrobat.adobe.com is Acrobat's web app and document cloud as much as a website.

