[project]
name = "smokeping-config-manager"
version = "2.0.0"
description = "SmokePing Configuration Manager with Database Backend"
authors = [
    {name = "SmokePing Team", email = "team@smoking-pi.dev"}
]
# readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # Web Framework
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    
    # Data Validation & Serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    
    # Configuration & Templates
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    
    # HTTP Clients & Utilities
    "requests>=2.31.0",
    "typer>=0.9.0",
    
    # Geolocation & Netflix OCA
    "geopy>=2.4.0",
    
    # Container Management
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "furo>=2023.9.0",
]

[project.scripts]
config-generator = "smokeping_config.scripts.config_generator:main"
migrate-yaml = "smokeping_config.scripts.migrate_yaml_to_db:main"
oca-fetcher = "smokeping_config.scripts.oca_fetcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py", "scripts/*.py", "templates/*", "config/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0", 
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
[tool.ruff.lint]
# NOTE: starting with the critical-error subset so CI is green on the
# existing codebase; expand (I, B, C4, UP, SIM) as code is cleaned up.
select = [
    "E9",  # pycodestyle runtime errors (syntax, io)
    "F63", # pyflakes: invalid comparisons/prints
    "F7",  # pyflakes: syntax-adjacent errors
    "F82", # pyflakes: undefined names
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101"]  # Use of assert detected

[tool.black]
target-version = ['py311']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# NOTE: strictness intentionally relaxed to match the current (unannotated)
# codebase; tighten incrementally as modules gain annotations.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "geopy.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]