[project]
name = "smokeping-ai-insights"
version = "1.0.0"
description = "AI-generated network health reports from SmokePing time-series data (InfluxDB + Claude)"
authors = [
    {name = "SmokePing Team", email = "team@smoking-pi.dev"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # Claude API client
    "anthropic>=0.40",

    # InfluxDB 2.x client for latency / loss / microcut aggregates
    "influxdb-client>=1.40",

    # HTTP client (shared repo convention; used by anthropic transitively too)
    "httpx>=0.27",

    # Report text templating
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]
exclude = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Match the repo-wide critical-error subset used by config-manager.
select = [
    "E9",  # pycodestyle runtime errors (syntax, io)
    "F63", # pyflakes: invalid comparisons/prints
    "F7",  # pyflakes: syntax-adjacent errors
    "F82", # pyflakes: undefined names
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
